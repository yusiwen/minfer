# Deploy the mdBook documentation site to GitHub Pages.
#
# Triggered on push to the default branch (and manually via workflow_dispatch).
# Requires the repo's Settings → Pages → Source to be "GitHub Actions" (already
# set). The site is published at the project-sites path, i.e.
# https://<user>.github.io/minfer/ — mdBook emits relative asset links, so it
# works under that subpath without a custom base path.
name: Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow this workflow to build and deploy the Pages site.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels the in-flight one.
concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        uses: taiki-e/install-action@mdbook
      - name: Build the book
        run: mdbook build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
