# Deploy the mdBook documentation site to GitHub Pages.
#
# Triggered on push to the default branch (and manually via workflow_dispatch).
# Requires the repo's Settings → Pages → Source to be "GitHub Actions" (already
# set). The site is published at the project-sites path, i.e.
# https://<user>.github.io/minfer/ — mdBook emits relative asset links, so it
# works under that subpath without a custom base path.
name: Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow this workflow to build and deploy the Pages site.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels the in-flight one.
concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04 # pinned, like release.yml: `ubuntu-latest` migrates to Ubuntu 26 and emits a deprecation annotation
    steps:
      - uses: actions/checkout@v5
      # Pinned to 0.4.37 — the same version the local devShell ships, so local and
      # CI builds render identically. Diagrams are inline SVG in docs/figures/ now
      # (no preprocessor, no client-side renderer), so mdBook is the whole
      # toolchain and no Rust/cargo step is needed.
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.37
      - name: Build the book
        run: scripts/build_book.sh
      # Same figure gate as `check-docs`; the deploy refuses a book whose figures break the rules.
      - name: Every figure must follow the book's figure rules
        run: python3 scripts/check_figures.py --root . --strict
      # v5 is the Node.js 24 major of both Pages actions (v3/v4 emitted the
      # deprecation annotation); their inputs are unchanged.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-24.04 # pinned, like release.yml: `ubuntu-latest` migrates to Ubuntu 26 and emits a deprecation annotation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
