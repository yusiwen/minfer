# CI — seven jobs: one per backend that can be checked without a device, plus the
# documentation gate, the viz gate, the workflow-lint gate and the PR-body gate.
#
# 1. test-linux-cpu   : the runtime net. Runs the whole unit suite (the
#                       integration tests under tests/ need a GGUF model that is
#                       not checked in and stay #[ignore]d) plus the CPU-side
#                       graph/allocator/scheduler tests. This is the job that
#                       must go red when a change breaks behaviour rather than
#                       compilation. It tees its own log and
#                       `scripts/check_status.py --check-live` compares the
#                       `x86_64 (CI runner)` suite counts against it (#94).
#                       It also runs `cargo fmt --all --check` (#211) before the
#                       suite: the toolchain step installs the `rustfmt` component
#                       *for 1.97.1*, so the formatter is the one the pinned
#                       toolchain names, never `stable`'s.
#                       Its last step is the CPU half of the dead-code oracle
#                       (#254): a scratch copy with every `allow(dead_code)`
#                       stripped, so a newly hidden item fails the job. Last on
#                       purpose — the copy shares this job's warm `target/`, and
#                       nothing after it reads the stripped tree.
# 2. build-linux-cuda : compile check for the CUDA backend in NVIDIA's own devel
#                       image. GitHub runners have no GPU, so this cannot run
#                       anything — it catches nvcc/kernel-compile breakage only.
#                       Its last step is the CUDA half of the dead-code oracle
#                       (#254) — the maximal configuration, since `src/cuda.rs`
#                       and `src/graph/cuda_backend.rs` exist only under the
#                       feature — which is why the image installs `python3`.
# 3. build-macos      : the macOS/Metal compile check (Apple Silicon). It compiles the
#                       crate **and the test target** (`cargo test --no-run`). The
#                       crate build alone does not compile `#[cfg(test)]`, so from
#                       `cdf41b2` (2026-09-24, F4 made `Backend` a registry handle)
#                       to `4add59f` (2026-10-05) a broken macOS test target — 16
#                       pre-F4 `Tag::Metal` uses — was invisible here for eleven days
#                       (#303). Link-only: a GitHub runner has no Metal device, so the
#                       macOS-only assertions still need a Mac; the *compile* does not.
# 4. check-docs       : the documentation gate (#63, #94). `mdbook build` proves the
#                       book renders (a chapter missing from SUMMARY.md is a hard
#                       error there, and the toolchain matches the one Docs deploys
#                       with); `scripts/check_docs_links.py` proves every relative
#                       link in the markdown resolves — `mdbook build` happily
#                       renders a dead link into the HTML, which is how the docs
#                       rotted before; `scripts/check_status.py --check` proves the
#                       plan's phase counters / `next:` sentence / baseline commits
#                       and AGENTS.md's suite counts agree with docs/status.toml,
#                       and `--selftest` runs the checker's own cases. The ancestry
#                       test needs history, so this job fetches with `fetch-depth: 0`.
#                       It also runs the source-level CUDA launch-return audit (#162):
#                       every `<<<>>>` in src/cuda/kernels/*.cu must read its own error
#                       and carry an injection lever, which needs no GPU.
#                       It also runs Layer 1 of the dead-code ratchet (#254): a
#                       shape audit of every `allow(dead_code)` (a bare form is
#                       rejected, a `cfg_attr` must name a cfg, every annotation
#                       carries a reason) plus that checker's own cases. A source
#                       audit needs no build; the liveness half is the oracle that
#                       the two build/test jobs run last.
#                       It also runs `scripts/check_f6_fixtures.py` (#205): the
#                       F6 fixture manifest (`docs/f6-fixtures.json`) must be
#                       complete and explain every cross-box divergence, every
#                       `~/.cache/minfer/f6-src/…` fixture the source tree names
#                       must be an entry, and the checker's own cases prove a
#                       tampered copy is refused by name and digest. That is the
#                       shape half — CI has no fixture cache — and the byte half
#                       runs inside the F6 gates, which verify the file they
#                       resolve before comparing against it.
#                       It also runs `scripts/check_doc_line_anchors.py` (#266):
#                       `check_docs_links.py` sees link *targets*, not the
#                       `path:NNN` line anchors the docs cite code by, so a moved
#                       line rots silently — and the source-layout campaign moves
#                       400 of them. The anchors are resolved against the tree,
#                       range-checked, and (heuristically) symbol-checked; the
#                       historical records that cite a pre-split revision are
#                       frozen in the script with a reason apiece, and an
#                       exemption that no longer covers a failure is itself a
#                       failure (the dead-code ratchet's shape).
#                       And `scripts/check_anchor_drift.py` (#344): resolving is
#                       not pointing, so a PR that adds or removes lines in an
#                       anchored file is diffed against its merge base
#                       (`origin/<base_ref>...HEAD`, hence `fetch-depth: 0` here)
#                       and every live anchor compared with the old->new line map
#                       — `#329`'s 7 and `#299`'s 69 anchors were caught by a
#                       hand-written map, not by CI. Anchors whose cited line was
#                       removed are reported for a human; the same FROZEN set
#                       exempts the same records.
# 5. check-viz        : the shape-flow gate. `scripts/check_viz_e2e.mjs` replays the
#                       stage template against every exported sample and requires the
#                       computed shapes to equal the ones the engine actually
#                       exported (the layer the animation plays); the render check
#                       boots viz/e2e.js on a stubbed DOM/canvas and plays every
#                       step, so a crash in the render path fails here. Both are
#                       dependency-free Node, so the job needs no setup step.
# 6. lint-workflows   : the workflow gate (#178). `scripts/lint_workflows.sh`
#                       downloads a pinned actionlint release tarball, verifies
#                       its per-architecture sha256, and refuses to lint with
#                       unverified bytes. GitHub reports a workflow that does not
#                       *parse*; an unknown `runs-on` label, a `types:` value that
#                       is not a real pull-request activity, an `if:` that cannot
#                       be evaluated and a `needs:` naming a missing job are all
#                       green there and caught here. Shellcheck integration is off
#                       on purpose (see the script's header): its presence is not
#                       pinned, so leaving it on would make the verdict depend on
#                       the runner image rather than on the pinned binary.
# 7. check-pr-body    : the PR-body gate (#175, enforcing the gate contract's
#                       rules 3 and 5). `scripts/check_pr_body.py --selftest` runs
#                       the checker's own pass/fail cases, then the checker reads
#                       the body handed over through `env:` and refuses a body
#                       missing a required heading or leaving a gate section empty.
#                       `pull_request` only: a push to master has no PR body. It
#                       needs no token and no network, so it works on a fork PR.
#                       It is also the one job that must keep running when the PR
#                       body is *edited* — see the paragraph below.
#
# A `pull_request` `edited` event changes no code, but `types:` is workflow-level:
# without a guard, fixing a typo in a PR body would re-run every job against an
# unchanged tree. Jobs 1–6 therefore carry
#   if: github.event_name != 'pull_request' || github.event.action != 'edited'
# and report `skipped` on such an event, while check-pr-body (whose input *is* the
# edited body) stays unconditional on `pull_request`. A push, `opened`,
# `synchronize` and `reopened` still run every job exactly as before (#177).
#
# `actions/checkout` is pinned to its Node.js 24 major (v5): the v4 line still
# ships the Node.js 20 runtime, which GitHub now force-runs on 24 and reports as
# a deprecation annotation on every job. `dtolnay/rust-toolchain` is a composite
# action and brings no Node runtime of its own.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # `edited` is what makes a body fix re-run the check: without it a PR whose
    # job failed on a missing section stays red after the section is filled in.
    # The other six jobs carry an `if:` that makes an `edited` event a no-op for
    # them (#177): only check-pr-body reads the new body.
    types: [opened, synchronize, reopened, edited]

jobs:
  test-linux-cpu:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-24.04 # pinned, like release.yml: `ubuntu-latest` migrates to Ubuntu 26 and emits a deprecation annotation
    steps:
      - uses: actions/checkout@v5
      # `components: rustfmt` installs the formatter *for the pinned toolchain*:
      # 1.97.1 ships no rustfmt by default, and the `stable` one is a different
      # version — a formatter that disagrees with the toolchain is exactly how a
      # "green CI, red local hook" split appears (#211).
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      # Without this the job compiles the whole crates.io tree on every push and
      # every PR — `cargo test --release` builds the dependencies before it runs
      # a single test. Its key carries this job's id, so it is its own entry.
      - uses: Swatinem/rust-cache@v2
      # Formatting first: it costs seconds and short-circuits the long suite.
      # rustfmt names every file it would change.
      - name: Formatting (rustfmt for 1.97.1)
        run: cargo fmt --all --check
      # `set -o pipefail` is not inherited: GitHub's default shell is `bash -e {0}`.
      # Without it `cargo test | tee LOG` reports *tee*'s status, so a failing suite
      # would leave this step green while the next one parses its log.
      - name: Test (release, CPU)
        run: |
          set -o pipefail
          cargo test --release 2>&1 | tee /tmp/cargo-test.log
      - name: The x86_64 suite counts must match this run
        run: python3 scripts/check_status.py --check-live /tmp/cargo-test.log --box 'x86_64 (CI runner)'
      # #254 Layer 2, the default configuration. Deliberately the last step: the
      # scratch copy shares this job's warm target/, so only the crate is
      # rechecked, and nothing below would want the stripped tree.
      - name: Newly dead code must fail the dead-code oracle (CPU)
        run: python3 scripts/check_dead_code_oracle.py --config cpu

  # The container tag carries both the CUDA toolkit and the base image, and the
  # base is the compile-time glibc/gcc floor. Keep the toolkit at a version
  # build.rs is known to support (12.x and 13.x today) and keep the base at
  # ubuntu24.04: the x64 *release* job runs in this exact image
  # (`.github/workflows/release-build.yml` `linux-x64-cuda`), so a base mismatch
  # here means CI compiles on a glibc/gcc pair no artifact is ever built on. It
  # used to be `devel-ubuntu22.04` — glibc 2.35 / gcc 11 — against the artifact's
  # 2.39 / gcc 13. Bump the two files together.
  #
  # 12.8.2 specifically is the toolkit the release job's apt install used to
  # resolve (`cuda-toolkit-12-8 12.8.2-1`, cudart 12.8.90-1), and the image ships
  # exactly that — so the tag pins the toolkit without moving it.
  #
  # `cargo test --no-run` matters as much as the build: the `#[cfg(test)]`
  # modules in cuda_backend.rs are only compiled when tests are compiled, so
  # `cargo build` alone silently skips them (that is how the A5 signature
  # change broke four CUDA test call sites without any local or CI signal).
  build-linux-cuda:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-24.04 # pinned, like release.yml: `ubuntu-latest` migrates to Ubuntu 26 and emits a deprecation annotation
    container: nvidia/cuda:12.8.2-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v5
      # The CUDA devel images are minimal: no curl, so `dtolnay/rust-toolchain`
      # cannot bootstrap rustup (it failed with "curl: command not found").
      # build-essential also gives nvcc its host compiler and the linker.
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates build-essential python3
      - uses: dtolnay/rust-toolchain@1.97.1
      # This job does not share a cache with the release x64 job: rust-cache's key
      # includes the job id (`build-linux-cuda` ≠ `linux-x64-cuda`), which is the
      # point — one job's cache can never be restored by a differently-shaped job.
      # It then saves the crates.io compile that this job's build *and* its
      # test-harness compile would otherwise both start from zero every run.
      - uses: Swatinem/rust-cache@v2
      - name: Build (release, cuda)
        run: cargo build --release --features cuda
      - name: Compile the test harness (no device on a hosted runner)
        run: cargo test --release --features cuda --no-run
      # #254 Layer 2, the maximal configuration. Deliberately the last step: the
      # scratch copy shares this job's warm target/, so only the crate is
      # rechecked, and nothing below would want the stripped tree.
      - name: Newly dead code must fail the dead-code oracle (cuda)
        run: python3 scripts/check_dead_code_oracle.py --config cuda

  build-macos:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: macos-14 # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v5
      # No `dtolnay/rust-toolchain` step here, unlike the release job: the
      # toolchain is pinned by the repository's `rust-toolchain.toml` (1.97.1),
      # which rustup honours on the first `cargo` invocation — so the cache key,
      # and the compiler that actually runs, are the same on both paths.
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release
      # #303: `cargo build` never compiles `#[cfg(test)]`, so a broken macOS test
      # target stayed green here while no macOS test could run at all (see the job
      # comment above). `--no-run` links the test binaries without executing them.
      - name: Compile tests (release, link only)
        run: cargo test --release --no-run

  # The documentation gate (#63, #94). Checked first because it is the cheap half and
  # the half that catches rot: a renamed file leaves a dead link that `mdbook build`
  # renders without complaint, and a hand-edited counter drifts from its source.
  check-docs:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-24.04 # pinned, like release.yml: `ubuntu-latest` migrates to Ubuntu 26 and emits a deprecation annotation
    steps:
      # `fetch-depth: 0` is required, not cosmetic: `check_status.py --check` asserts
      # the plan's baseline and refreshed-against commits are ancestors of HEAD, and
      # the default shallow clone (depth 1) cannot answer that — the test would fail
      # spuriously on a commit that is perfectly fine.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check every relative link in the markdown
        run: python3 scripts/check_docs_links.py
      - name: The status prose must agree with docs/status.toml
        run: python3 scripts/check_status.py --check
      - name: The status checker's own pass/fail cases
        run: python3 scripts/check_status.py --selftest
      # #162: every `<<<>>>` in src/cuda/kernels/*.cu must read its own launch
      # error through minfer_launch_ok/_opt and carry a real-failure injection
      # lever. A source audit needs no GPU, and the CUDA container's python3 is
      # not guaranteed — this job's is. `--check-fixture` pins the site list the
      # device gate `cuda_issue162_every_launch_site_names_itself_and_leaves_no_latch`
      # compares its driven set against, so a new site cannot slip in unlisted.
      - name: Every CUDA launch site must read its own error
        run: python3 scripts/check_cuda_launch_returns.py
      - name: The CUDA launch audit's own pass/fail cases
        run: python3 scripts/check_cuda_launch_returns.py --selftest
      - name: The CUDA launch-site fixture must match the source
        run: python3 scripts/check_cuda_launch_returns.py --check-fixture tests/fixtures/cuda_launch_sites.tsv
      # The layout rules AGENTS.md states: a test module is a file (never an
      # inline `#[cfg(test)] mod … {`), and every `src/**.rs` is named by a `mod`
      # declaration. The second half is the dangerous one — an undeclared file is
      # never compiled, so tests inside it silently do not run while CI stays
      # green. A source audit needs no build and no GPU.
      - name: Every test module is a file, and every source file is declared
        run: python3 scripts/check_source_layout.py
      - name: The source-layout checker's own pass/fail cases
        run: python3 scripts/check_source_layout.py --selftest
      # The always-loaded index has a byte cap (#434). `AGENTS.md` is loaded into
      # every session as workspace instructions, so once it is long enough the
      # budget truncates it and drops the *other* instruction files entirely —
      # which is how the global ~/.dsh/AGENTS.md was lost. The cap is a ratchet:
      # raising it is allowed, but it is a decision taken in the commit that
      # grows the file, and moving the block to its topic doc is preferred. The
      # failure names the largest section, so it says what to move.
      - name: AGENTS.md must stay small enough to be an index
        run: python3 scripts/check_agents_size.py
      - name: The AGENTS.md size ratchet's own pass/fail cases
        run: python3 scripts/check_agents_size.py --selftest
      # The decision corpus (#439). An ADR is a frozen record: dense numbering from
      # 0001 that is never reused, four allowed Status values, a two-way
      # forward-only `Superseded` link, every ADR listed in the index, and the
      # index a chapter of the book. A source audit needs no build.
      - name: Every ADR must be numbered, dated and indexed
        run: python3 scripts/check_adr.py
      - name: The ADR checker's own pass/fail cases
        run: python3 scripts/check_adr.py --selftest
      # #254 Layer 1: the shape of every `allow(dead_code)` — a bare annotation
      # is rejected (the 11 sites that predate the ratchet are grandfathered in
      # the script), a `cfg_attr` must name a cfg, and each annotation carries a
      # reason. It is a *shape* audit: liveness is the oracle the two build/test
      # jobs run last. This job has python3 and needs no toolchain for it.
      - name: Every dead-code annotation must carry an allowed shape and a reason
        run: python3 scripts/check_dead_code_annotations.py
      - name: The annotation-shape checker's own pass/fail cases
        run: python3 scripts/check_dead_code_annotations.py --selftest
      # The oracle's parser/strip cases, without cargo: the real check runs in the
      # build/test jobs, but a broken strip or item derivation must not wait for
      # those to be noticed.
      - name: The dead-code oracle's own pass/fail cases
        run: python3 scripts/check_dead_code_oracle.py --selftest
      # #266: a `path:NNN` anchor must name a file of this tree *and* a real line of
      # it, and — when the anchor names a symbol — that symbol must be in the file
      # the anchor points at. The historical records whose anchors cite a pre-split
      # revision are frozen inside the script, each with a reason; an exemption that
      # no longer covers anything fails, so the frozen set only shrinks. A docs+
      # source audit needs no toolchain and no GPU.
      - name: Every `path:NNN` anchor must resolve to a real line
        run: python3 scripts/check_doc_line_anchors.py
      - name: The doc-line-anchor checker's own pass/fail cases
        run: python3 scripts/check_doc_line_anchors.py --selftest
      # #344: resolving is not pointing. A PR that adds or removes lines in a file
      # the docs anchor into shifts every anchor below the edit, and the checker
      # above stays green because the numbers still resolve. This diffs `HEAD`
      # against the *merge base* of the target branch — `origin/<base_ref>...HEAD`
      # is exactly that, and it is why this job's checkout needs `fetch-depth: 0`
      # (the docstring above says why that is required for `check_status.py`; the
      # merge base is the second reason). `origin/<base_ref>` is fetched by
      # actions/checkout at depth 0, so the base is always present in this job;
      # `pull_request` only, because a push to the default branch has no base.
      - name: An anchor whose target moved must have been re-pointed
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_anchor_drift.py "origin/$BASE_REF"
      - name: The anchor-drift checker's own pass/fail cases
        run: python3 scripts/check_anchor_drift.py --selftest
      # #205: the F6 gates compare against fixtures under ~/.cache/minfer/f6-src/
      # that CI does not have, so this job carries the half that needs no bytes —
      # the manifest's shape, the tree cross-check, and the checker's own tamper
      # cases. The byte half is the F6 gates' own fixture verification.
      - name: The F6 fixture manifest must be well formed
        run: python3 scripts/check_f6_fixtures.py --check
      - name: The F6 fixture verifier's own pass/fail cases
        run: python3 scripts/check_f6_fixtures.py --selftest
      # #345: a recorded producer command that cannot be re-run is a dead record,
      # so the manifest has to keep one runnable command per entry (S7 of
      # `--check`). This job has no fixture cache, no built `minfer` and no
      # `llama-quantize`, so the dry run only classifies — RUN, or REFUSED with
      # the reason — and writes nothing; the refusals it prints here are the
      # honest per-box answer, not a failure.
      - name: The F6 producers must stay re-runnable (dry run)
        run: python3 scripts/check_f6_fixtures.py --regenerate --dry-run
      # Same toolchain as Docs (`.github/workflows/docs.yml`), so the gate builds the
      # book the site actually ships: mdBook 0.4.37 because 0.5 changed the
      # preprocessor protocol, and mdbook-mermaid 0.13.0 because it only understands
      # the 0.4.x format.
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.37
      - name: Install mdbook-mermaid
        run: cargo install mdbook-mermaid --locked --version 0.13.0
      # The Mermaid library is not committed: the script downloads it (sha384-pinned),
      # stages it inside the book, builds, and removes it again — see scripts/build_book.sh.
      - name: Build the book
        run: scripts/build_book.sh
      - name: The staged Mermaid assets must not survive the build
        run: |
          test ! -e docs/assets/mermaid.min.js
          test ! -e docs/assets/mermaid-init.js

  # The viz gate: the shape-flow model must agree with the engine's own export,
  # and the render path must survive a full timeline. `node` is preinstalled on
  # the runner image; adding `actions/setup-node@v4` would drag in the Node.js 20
  # runtime the header comment warns about.
  check-viz:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-24.04 # pinned, like release.yml: `ubuntu-latest` migrates to Ubuntu 26 and emits a deprecation annotation
    steps:
      - uses: actions/checkout@v5
      - name: Shapes must match every exported sample graph
        run: node scripts/check_viz_e2e.mjs
      - name: The animation must boot and play every step headlessly
        run: node scripts/check_viz_e2e_render.mjs

  # The workflow gate (#178). `scripts/lint_workflows.sh` pins actionlint 1.7.12
  # by release tarball *and* per-architecture sha256 (the `scripts/build_book.sh`
  # precedent) and refuses to lint unverified bytes; shellcheck integration is
  # disabled there on purpose. No toolchain, no cache: one checkout and one step.
  lint-workflows:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-24.04 # pinned, like release.yml: `ubuntu-latest` migrates to Ubuntu 26 and emits a deprecation annotation
    steps:
      - uses: actions/checkout@v5
      - name: Every workflow file must lint clean
        run: scripts/lint_workflows.sh

  # The PR-body gate (#175): the two facts the gate contract asks a PR to state
  # in prose — the bar named *before* measuring and the mutation evidence — have
  # a mechanical floor. `--selftest` runs the checker's own cases first, so a
  # broken checker cannot silently pass every body; then the real body is handed
  # over through `env:` and read with `--body-env`. Interpolating
  # `${{ github.event.pull_request.body }}` into a `run:` command would be a
  # script-injection hazard, and a PR body is attacker-controlled text.
  #
  # `if:` keeps the job off a push to master, where there is no PR body, and it is
  # deliberately *not* guarded against `edited`: re-reading the edited body is the
  # whole reason `edited` is in the trigger `types:` (#177). No API token and no
  # network: `gh` is never called, so the job works for a fork PR.
  check-pr-body:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04 # pinned, like release.yml: `ubuntu-latest` migrates to Ubuntu 26 and emits a deprecation annotation
    steps:
      - uses: actions/checkout@v5
      - name: The checker's own pass/fail cases
        run: python3 scripts/check_pr_body.py --selftest
      - name: The PR body must carry both gate sections, filled
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_pr_body.py --body-env PR_BODY
