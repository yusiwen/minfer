# CI — eight jobs: a change classifier, one job per backend that can be checked
# without a device, plus the documentation gate, the viz gate, the workflow-lint
# gate and the PR-body gate. The classifier (`changes`, #457) decides whether the
# three code jobs run at all; the numbered list below still describes them.
#
# 1. test-linux-cpu   : the runtime net. Runs the whole unit suite (the
#                       integration tests under tests/ need a GGUF model that is
#                       not checked in and stay #[ignore]d) plus the CPU-side
#                       graph/allocator/scheduler tests. This is the job that
#                       must go red when a change breaks behaviour rather than
#                       compilation. It tees its own log and
#                       `scripts/check_baselines.py --check-live` compares the
#                       `x86_64 (CI runner)` suite counts against it (#94).
#                       It also runs `cargo fmt --all --check` (#211) before the
#                       suite: the toolchain step installs the `rustfmt` component
#                       *for 1.97.1*, so the formatter is the one the pinned
#                       toolchain names, never `stable`'s.
#                       Its last step is the CPU half of the dead-code oracle
#                       (#254): a scratch copy with every `allow(dead_code)`
#                       stripped, so a newly hidden item fails the job. Last on
#                       purpose — the copy shares this job's warm `target/`, and
#                       nothing after it reads the stripped tree.
# 2. build-linux-cuda : compile check for the CUDA backend in NVIDIA's own devel
#                       image. GitHub runners have no GPU, so this cannot run
#                       anything — it catches nvcc/kernel-compile breakage only.
#                       Its last step is the CUDA half of the dead-code oracle
#                       (#254) — the maximal configuration, since `src/cuda.rs`
#                       and `src/graph/cuda_backend.rs` exist only under the
#                       feature — which is why the image installs `python3`.
# 3. build-macos      : the macOS/Metal compile check (Apple Silicon). It compiles the
#                       crate **and the test target** (`cargo test --no-run`). The
#                       crate build alone does not compile `#[cfg(test)]`, so from
#                       `cdf41b2` (2026-09-24, F4 made `Backend` a registry handle)
#                       to `4add59f` (2026-10-05) a broken macOS test target — 16
#                       pre-F4 `Tag::Metal` uses — was invisible here for eleven days
#                       (#303). Link-only: a GitHub runner has no Metal device, so the
#                       macOS-only assertions still need a Mac; the *compile* does not.
# 4. check-docs       : the documentation gate (#63, #94). `mdbook build` proves the
#                       book builds with the toolchain Docs deploys with; it does
#                       *not* prove a link resolves — mdBook publishes a `README.md`
#                       chapter as `index.html` while rewriting the link to
#                       `README.html`, silently drops a `docs/**.md` that
#                       `SUMMARY.md` does not name, and silently renders an empty
#                       draft page for a SUMMARY entry whose file is gone (all three
#                       measured on 0.4.37, #515). So three checkers read the two
#                       halves: `scripts/check_docs_links.py` proves every relative
#                       link in the markdown resolves **in the checkout**,
#                       `scripts/check_book_links.py` proves every link in the
#                       *rendered* `book/` resolves (and every `#fragment` is an
#                       `id=` in its target), and `scripts/check_book_coverage.py`
#                       proves every `docs/**.md` is a chapter or a reasoned
#                       exclusion; `scripts/check_status.py --check` proves the
#                       plan's phase counters / `next:` sentence / baseline commits
#                       and its §11 sequencing marks agree with `scripts/status.toml`,
#                       and
#                       `scripts/check_baselines.py --check` proves the suite
#                       measurements agree with `scripts/test-baselines.toml`; each
#                       binary's `--selftest` runs its own cases. Both ledgers live
#                       beside the checker that reads them (#455) — and so do the two
#                       book ledgers (`scripts/book-links.toml`,
#                       `scripts/book-coverage.toml`) — and each step
#                       names its ledger, so a rename or a deletion fails the job
#                       instead of silently disabling a gate. The ancestry test needs
#                       history, so this job fetches with `fetch-depth: 0`.
#                       It also runs the source-level CUDA launch-return audit (#162):
#                       every `<<<>>>` in src/cuda/kernels/*.cu must read its own error
#                       and carry an injection lever, which needs no GPU.
#                       It also runs Layer 1 of the dead-code ratchet (#254): a
#                       shape audit of every `allow(dead_code)` (a bare form is
#                       rejected, a `cfg_attr` must name a cfg, every annotation
#                       carries a reason) plus that checker's own cases. A source
#                       audit needs no build; the liveness half is the oracle that
#                       the two build/test jobs run last.
#                       It also runs `scripts/check_f6_fixtures.py` (#205): the
#                       F6 fixture manifest (`tests/fixtures/f6-fixtures.json`) must be
#                       complete and explain every cross-box divergence, every
#                       `~/.cache/minfer/f6-src/…` fixture the source tree names
#                       must be an entry, and the checker's own cases prove a
#                       tampered copy is refused by name and digest. That is the
#                       shape half — CI has no fixture cache — and the byte half
#                       runs inside the F6 gates, which verify the file they
#                       resolve before comparing against it.
#                       It also runs `scripts/docset.py` (#522): the file set every
#                       doc gate reads — every tracked `*.md` minus a reasoned,
#                       ratcheted ledger — and `scripts/check_doc_line_anchors.py` (#266):
#                       `check_docs_links.py` sees link *targets*, not the
#                       `path:NNN` line anchors the docs cite code by, so a moved
#                       line rots silently — and the source-layout campaign moves
#                       400 of them. The anchors are resolved against the tree,
#                       range-checked, and (heuristically) symbol-checked; a
#                       doc-cited `…::tests::…` path must name a `fn` or a `mod`
#                       that exists under `src/` or `tests/` (rule G), which is
#                       the one locator class that carries no `path:NNN` at all; the
#                       historical records that cite a pre-split revision are
#                       frozen in the script with a reason apiece, and an
#                       exemption that no longer covers a failure is itself a
#                       failure (the dead-code ratchet's shape).
#                       And `scripts/check_doc_counts.py` (#641): a derived count in
#                       a live document must carry the revision it measured — on the
#                       claim's line (or a neighbour), or in the document's header,
#                       which is how the walkthrough's `Code:`/`Sizes:` block and every
#                       dated record declare their base. A number is the one claim no
#                       gate can verify for truth; #219 corrected a batch of them and
#                       #636 found three wrong again in sixteen days. The ledger beside
#                       it (`scripts/doc-counts.toml`) ships empty on purpose — every
#                       claim in the tree names its revision — and is ratcheted both
#                       ways: an entry that exempts nothing fails.
#                       And `scripts/check_doc_hashes.py` (#684): a backticked commit
#                       hash is a locator no other checker reads — not a relative link,
#                       not a `path:NNN` anchor — so it must resolve to a commit **HEAD
#                       can reach**, or be pinned in `scripts/doc-hashes.toml` with a
#                       source and a reason, or sit in a document whose
#                       `<!-- doc-hashes: history -->` marker covers it. Measured on
#                       adoption (a fresh clone): 936 tokens, 807 resolve, 129
#                       unresolvable, 0 unexcused. Both ratchet (an entry nobody cites
#                       fails, an entry whose hash resolves now fails, a marker that
#                       covers nothing fails), and a shallow clone exits 2 rather than
#                       passing on objects it never fetched. Ancestry, not existence: a
#                       checkout that has amended keeps the discarded commits, and the
#                       first CI run found 14 citations a local existence probe had
#                       admitted — the reason the check is `rev-list HEAD` membership.
#                       And `scripts/check_doc_code_copies.py` (#647): a fenced block
#                       whose first line names a repository source file is a
#                       transcription claim — "this is src/…, as it was when I copied
#                       it". #219 and #645 both found that rot. The page must include
#                       the source instead (`{{#rustdoc_include path:anchor}}`, the
#                       plain `{{#include}}` being reserved by the figure checker), and
#                       the ledger beside it is a migration list that can only shrink:
#                       a new claim fails, a conversion must lower its count in the
#                       same commit, and an entry that covers nothing fails too.
#                       And `scripts/check_anchor_drift.py` (#344): resolving is
#                       not pointing, so a PR that adds or removes lines in an
#                       anchored file is diffed against its merge base
#                       (`origin/<base_ref>...HEAD`, hence `fetch-depth: 0` here)
#                       and every live anchor compared with the old->new line map;
#                       a push to the default branch diffs against the event's
#                       pre-push tip instead, so two PRs that each passed cannot
#                       leave a combined shift behind, and a force-push (whose tip
#                       has no linear ancestor) fails loudly rather than skipping.
#                       `#329`'s 7 and `#299`'s 69 anchors were caught by a
#                       hand-written map, not by CI. Anchors whose cited line was
#                       removed are reported for a human; the same FROZEN set
#                       exempts the same records.
# 5. check-viz        : the visualizer gate. `scripts/check_viz_e2e.mjs` replays the
#                       stage template against every exported sample and requires the
#                       computed shapes to equal the ones the engine actually
#                       exported (the layer the animation plays); `check_viz_e2e_render.mjs`
#                       boots viz/e2e.js on a stubbed DOM/canvas and plays every
#                       step, and `check_viz_app.mjs` boots viz/app.js the same way
#                       (the operator/pipeline page: the `?file=` deep link, the grid
#                       and pipeline builds, a node click, the ×N layer expansion),
#                       counting what the export implies rather than what the page
#                       says (#549). `scripts/check_viz_assets.mjs` covers what the
#                       pages pull in from outside: it evaluates each page's asset
#                       loader and requires its requests to equal the `viz/*.css` +
#                       `viz/*.js` file set, with no literal `href=`/`src=` bypass
#                       (#103, which replaced a hand-bumped `?v=N` that had no check
#                       at all), and it audits every `fetch(...)` in those scripts
#                       for the `cache: 'no-cache'` that makes a regenerated sample
#                       visible on a reload (#546). All four are dependency-free
#                       Node, so the job needs no setup step.
# 6. lint-workflows   : the workflow gate (#178, #215). `scripts/lint_workflows.sh`
#                       downloads a pinned actionlint release tarball *and* a
#                       pinned shellcheck one, verifies each per-architecture
#                       sha256, and refuses to lint with unverified bytes. GitHub
#                       reports a workflow that does not *parse*; an unknown
#                       `runs-on` label, a `types:` value that is not a real
#                       pull-request activity, an `if:` that cannot be evaluated, a
#                       `needs:` naming a missing job and a `run:` block shellcheck
#                       rejects are all green there and caught here. Both tools
#                       come from the script's own pins rather than from PATH, so
#                       the verdict does not move with the runner image.
# 7. check-pr-body    : the PR-body gate (#175, enforcing the gate contract's
#                       rules 3 and 5). `scripts/check_pr_body.py --selftest` runs
#                       the checker's own pass/fail cases, then the checker reads
#                       the body handed over through `env:` and refuses a body
#                       missing a required heading or leaving a gate section empty.
#                       `pull_request` only: a push to master has no PR body. It
#                       needs no token and no network, so it works on a fork PR.
#                       It is also the one job that must keep running when the PR
#                       body is *edited* — see the paragraph below.
#
# Two triggers would otherwise waste a whole run, and both are handled by
# *job-level* guards — never by `paths:` / `paths-ignore:`, which leaves a
# workflow's required checks in `Pending` forever (a skipped *job* reports
# `Success` instead, which is what makes the board green):
#
# 1. A `pull_request` `edited` event changes no code, but `types:` is
#    workflow-level: without a guard, fixing a typo in a PR body would re-run every
#    job against an unchanged tree. Jobs 1–7 therefore carry
#      if: github.event_name != 'pull_request' || github.event.action != 'edited'
#    and report `skipped` on such an event, while check-pr-body (whose input *is*
#    the edited body) stays unconditional on `pull_request` — it classifies the range
#    itself for the #539 ADR question rather than `needs: changes`, because a job that
#    needs a skipped one is skipped too, and a failing body must be fixable by an edit
#    that re-runs the check. A push, `opened`,
#    `synchronize` and `reopened` still run every job the classifier asks for
#    (#177).
# 2. A docs-only change does not need the crate compiled. `changes` runs
#    `scripts/classify_changes.py` over the diff once, and the three code jobs add
#    `needs.changes.outputs.rust == 'true'`; the suite job also runs when the suite
#    ledger moved (`baselines == 'true'`, since its `--check-live` reads that file).
#    The measurement behind it: over 13 runs on 2026-10-09, `build-linux-cuda` is
#    12.3 min median and `build-macos` 1.9 — against `check-docs` 1.3 and
#    `test-linux-cpu` 1.1 — while 104 of the last 200 non-merge commits changed
#    documentation only (#457). `check-docs` and `check-pr-body` are never gated:
#    the first *is* the docs gate, the second reads the PR body.
#
# `actions/checkout` is pinned to its Node.js 24 major (v5): the v4 line still
# ships the Node.js 20 runtime, which GitHub now force-runs on 24 and reports as
# a deprecation annotation on every job. `dtolnay/rust-toolchain` is a composite
# action and brings no Node runtime of its own.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # `edited` is what makes a body fix re-run the check: without it a PR whose
    # job failed on a missing section stays red after the section is filled in.
    # The other seven jobs carry an `if:` that makes an `edited` event a no-op for
    # them (#177): only check-pr-body reads the new body.
    types: [opened, synchronize, reopened, edited]

jobs:
  # The classifier for the three code jobs (#457). One job, one `git diff`, and the
  # rest of the workflow reads its two outputs; a docs-only change therefore skips
  # the builds without a path filter (the header says why that distinction is the
  # whole point). It is the only place the diff is read.
  changes:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-24.04 # pinned, like release.yml: `ubuntu-latest` migrates to Ubuntu 26 and emits a deprecation annotation
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      baselines: ${{ steps.classify.outputs.baselines }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The three-dot range needs the merge base, so the base branch must be
          # present — the same `fetch-depth: 0` reason the doc job gives below.
          fetch-depth: 0
      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # A `pull_request` compares against the base branch (the classifier's own
          # three-dot range takes the merge base); a push compares against `before`.
          # The classifier treats the all-zero SHA git reports for a first push, an
          # empty base, an empty diff and an unresolvable revision as "run
          # everything", so a range it cannot read never skips a job.
          if [ "$EVENT" = "pull_request" ]; then
            BASE="origin/$BASE_REF"
          else
            BASE="$BEFORE"
          fi
          python3 scripts/classify_changes.py --base "$BASE" --head "$SHA" >> "$GITHUB_OUTPUT"

  test-linux-cpu:
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || github.event.action != 'edited')
      && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.baselines == 'true')
    runs-on: ubuntu-24.04 # pinned, like release.yml: `ubuntu-latest` migrates to Ubuntu 26 and emits a deprecation annotation
    steps:
      - uses: actions/checkout@v5
      # `components: rustfmt` installs the formatter *for the pinned toolchain*:
      # 1.97.1 ships no rustfmt by default, and the `stable` one is a different
      # version — a formatter that disagrees with the toolchain is exactly how a
      # "green CI, red local hook" split appears (#211).
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      # Without this the job compiles the whole crates.io tree on every push and
      # every PR — `cargo test --release` builds the dependencies before it runs
      # a single test. Its key carries this job's id, so it is its own entry.
      - uses: Swatinem/rust-cache@v2
      # Formatting first: it costs seconds and short-circuits the long suite.
      # rustfmt names every file it would change.
      - name: Formatting (rustfmt for 1.97.1)
        run: cargo fmt --all --check
      # `set -o pipefail` is not inherited: GitHub's default shell is `bash -e {0}`.
      # Without it `cargo test | tee LOG` reports *tee*'s status, so a failing suite
      # would leave this step green while the next one parses its log.
      - name: Test (release, CPU)
        run: |
          set -o pipefail
          cargo test --release 2>&1 | tee /tmp/cargo-test.log
      - name: The x86_64 suite counts must match this run
        run: python3 scripts/check_baselines.py --check-live /tmp/cargo-test.log --box 'x86_64 (CI runner)'
      # #254 Layer 2, the default configuration. Deliberately the last step: the
      # scratch copy shares this job's warm target/, so only the crate is
      # rechecked, and nothing below would want the stripped tree.
      - name: Newly dead code must fail the dead-code oracle (CPU)
        run: python3 scripts/check_dead_code_oracle.py --config cpu

  # The container tag carries both the CUDA toolkit and the base image, and the
  # base is the compile-time glibc/gcc floor. Keep the toolkit at a version
  # build.rs is known to support (12.x and 13.x today) and keep the base at
  # ubuntu24.04: the x64 *release* job runs in this exact image
  # (`.github/workflows/release-build.yml` `linux-x64-cuda`), so a base mismatch
  # here means CI compiles on a glibc/gcc pair no artifact is ever built on. It
  # used to be `devel-ubuntu22.04` — glibc 2.35 / gcc 11 — against the artifact's
  # 2.39 / gcc 13. Bump the two files together.
  #
  # 12.8.2 specifically is the toolkit the release job's apt install used to
  # resolve (`cuda-toolkit-12-8 12.8.2-1`, cudart 12.8.90-1), and the image ships
  # exactly that — so the tag pins the toolkit without moving it.
  #
  # `cargo test --no-run` matters as much as the build: the `#[cfg(test)]`
  # modules in cuda_backend.rs are only compiled when tests are compiled, so
  # `cargo build` alone silently skips them (that is how the A5 signature
  # change broke four CUDA test call sites without any local or CI signal).
  build-linux-cuda:
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || github.event.action != 'edited')
      && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04 # pinned, like release.yml: `ubuntu-latest` migrates to Ubuntu 26 and emits a deprecation annotation
    container: nvidia/cuda:12.8.2-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v5
      # The CUDA devel images are minimal: no curl, so `dtolnay/rust-toolchain`
      # cannot bootstrap rustup (it failed with "curl: command not found").
      # build-essential also gives nvcc its host compiler and the linker.
      - name: Install build prerequisites
        # `python3` pulls in `tzdata`, whose postinst asks for a geographic area.
        # Without this the debconf frontend falls back to Teletype and the step
        # waits forever instead of failing — `-y` answers apt's questions, not
        # debconf's (issue #544: 23m 7s stuck before a hand cancellation).
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates build-essential python3
      - uses: dtolnay/rust-toolchain@1.97.1
      # This job does not share a cache with the release x64 job: rust-cache's key
      # includes the job id (`build-linux-cuda` ≠ `linux-x64-cuda`), which is the
      # point — one job's cache can never be restored by a differently-shaped job.
      # It then saves the crates.io compile that this job's build *and* its
      # test-harness compile would otherwise both start from zero every run.
      - uses: Swatinem/rust-cache@v2
      - name: Build (release, cuda)
        run: cargo build --release --features cuda
      - name: Compile the test harness (no device on a hosted runner)
        run: cargo test --release --features cuda --no-run
      # #254 Layer 2, the maximal configuration. Deliberately the last step: the
      # scratch copy shares this job's warm target/, so only the crate is
      # rechecked, and nothing below would want the stripped tree.
      - name: Newly dead code must fail the dead-code oracle (cuda)
        run: python3 scripts/check_dead_code_oracle.py --config cuda

  build-macos:
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || github.event.action != 'edited')
      && needs.changes.outputs.rust == 'true'
    runs-on: macos-14 # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v5
      # No `dtolnay/rust-toolchain` step here, unlike the release job: the
      # toolchain is pinned by the repository's `rust-toolchain.toml` (1.97.1),
      # which rustup honours on the first `cargo` invocation — so the cache key,
      # and the compiler that actually runs, are the same on both paths.
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release
      # #303: `cargo build` never compiles `#[cfg(test)]`, so a broken macOS test
      # target stayed green here while no macOS test could run at all (see the job
      # comment above). `--no-run` links the test binaries without executing them.
      - name: Compile tests (release, link only)
        run: cargo test --release --no-run

  # The documentation gate (#63, #94). Checked first because it is the cheap half and
  # the half that catches rot: a renamed file leaves a dead link that `mdbook build`
  # renders without complaint, and a hand-edited counter drifts from its source.
  check-docs:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-24.04 # pinned, like release.yml: `ubuntu-latest` migrates to Ubuntu 26 and emits a deprecation annotation
    steps:
      # `fetch-depth: 0` is required, not cosmetic: `check_status.py --check` asserts
      # the plan's baseline and refreshed-against commits are ancestors of HEAD, and
      # the default shallow clone (depth 1) cannot answer that — the test would fail
      # spuriously on a commit that is perfectly fine.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check every relative link in the markdown
        run: python3 scripts/check_docs_links.py
      # The two ledgers are one file each, and each lives beside the checker that
      # reads it (#455). Every invocation names its ledger explicitly, so a rename
      # or a deletion is a red job, never a silently disabled gate.
      - name: The plan's status prose must agree with scripts/status.toml
        run: python3 scripts/check_status.py --check
      - name: The plan status checker's own pass/fail cases
        run: python3 scripts/check_status.py --selftest
      - name: The suite measurements must agree with scripts/test-baselines.toml
        run: python3 scripts/check_baselines.py --check
      - name: The suite-baseline checker's own pass/fail cases
        run: python3 scripts/check_baselines.py --selftest
      # #162: every `<<<>>>` in src/cuda/kernels/*.cu must read its own launch
      # error through minfer_launch_ok/_opt and carry a real-failure injection
      # lever. A source audit needs no GPU, and the CUDA container's python3 is
      # not guaranteed — this job's is. `--check-fixture` pins the site list the
      # device gate `cuda_issue162_every_launch_site_names_itself_and_leaves_no_latch`
      # compares its driven set against, so a new site cannot slip in unlisted.
      - name: Every CUDA launch site must read its own error
        run: python3 scripts/check_cuda_launch_returns.py
      - name: The CUDA launch audit's own pass/fail cases
        run: python3 scripts/check_cuda_launch_returns.py --selftest
      - name: The CUDA launch-site fixture must match the source
        run: python3 scripts/check_cuda_launch_returns.py --check-fixture tests/fixtures/cuda_launch_sites.tsv
      # The layout rules AGENTS.md states: a test module is a file (never an
      # inline `#[cfg(test)] mod … {`), and every `src/**.rs` is named by a `mod`
      # declaration. The second half is the dangerous one — an undeclared file is
      # never compiled, so tests inside it silently do not run while CI stays
      # green. A source audit needs no build and no GPU.
      - name: Every test module is a file, and every source file is declared
        run: python3 scripts/check_source_layout.py
      - name: The source-layout checker's own pass/fail cases
        run: python3 scripts/check_source_layout.py --selftest
      # The always-loaded index has a byte cap (#434). `AGENTS.md` is loaded into
      # every session as workspace instructions, so once it is long enough the
      # budget truncates it and drops the *other* instruction files entirely —
      # which is how the global ~/.dsh/AGENTS.md was lost. The cap is a ratchet:
      # raising it is allowed, but it is a decision taken in the commit that
      # grows the file, and moving the block to its topic doc is preferred. The
      # failure names the largest section, so it says what to move.
      - name: AGENTS.md must stay small enough to be an index
        run: python3 scripts/check_agents_size.py
      - name: The AGENTS.md size ratchet's own pass/fail cases
        run: python3 scripts/check_agents_size.py --selftest
      # The decision corpus (#439). An ADR is a frozen record: dense numbering from
      # 0001 that is never reused, four allowed Status values, a two-way
      # forward-only `Superseded` link, every ADR listed in the index, and the
      # index a chapter of the book. A source audit needs no build.
      - name: Every ADR must be numbered, dated and indexed
        run: python3 scripts/check_adr.py
      - name: The ADR checker's own pass/fail cases
        run: python3 scripts/check_adr.py --selftest
      # #519: the capability matrix is prose about code, so its AVX2 column rotted
      # silently — it marked Q5_0 as SIMD while `src/quants/` had no kernel for it.
      # This derives the AVX2 quant dots from the source and compares the column in
      # both directions. Pure and offline; its row-address note is in the script.
      - name: The support matrix's AVX2 column must match the kernels
        run: python3 scripts/check_support_matrix.py
      - name: The support-matrix checker's own pass/fail cases
        run: python3 scripts/check_support_matrix.py --selftest
      # #521/#531: three runtime knobs changed behaviour while the docs described the old
      # ones (`MINFER_N_BATCH` was read at every server start and named only in the plan
      # and the roadmap), because nothing enumerated what the engine reads. `env-vars.toml`
      # is the index now: every production `MINFER_*` name maps either to the file that
      # documents it — opened, required to be a live document, and required to name the
      # knob — or to `[internal]` with a reason, which fails if any live document does
      # name it. A knob in neither table fails with the source file that reads it.
      # The ledger's own totals line is compared with what the checker counted (#628),
      # so the numbers there cannot trail the code the way they did from #531 to #628.
      - name: Every runtime environment variable must be documented
        run: python3 scripts/check_env_vars.py
      - name: The env-var checker's own pass/fail cases
        run: python3 scripts/check_env_vars.py --selftest
      # #254 Layer 1: the shape of every `allow(dead_code)` — a bare annotation
      # is rejected (the 11 sites that predate the ratchet are grandfathered in
      # the script), a `cfg_attr` must name a cfg, and each annotation carries a
      # reason. It is a *shape* audit: liveness is the oracle the two build/test
      # jobs run last. This job has python3 and needs no toolchain for it.
      - name: Every dead-code annotation must carry an allowed shape and a reason
        run: python3 scripts/check_dead_code_annotations.py
      - name: The annotation-shape checker's own pass/fail cases
        run: python3 scripts/check_dead_code_annotations.py --selftest
      # The oracle's parser/strip cases, without cargo: the real check runs in the
      # build/test jobs, but a broken strip or item derivation must not wait for
      # those to be noticed.
      - name: The dead-code oracle's own pass/fail cases
        run: python3 scripts/check_dead_code_oracle.py --selftest
      # #522: which markdown those gates read is discoverable — every tracked `*.md`,
      # minus `scripts/markdown-scope.toml`'s reasoned file-level exclusions — and the
      # walk must account for every tracked file. Before this, the set was `docs/**`
      # plus `AGENTS.md`, and four anchors citing the deleted
      # `src/models/qwen2/forward.rs` sat unread in `experiments/`. The scope layer's
      # own cases run first so a broken ledger is named before a checker reports on it.
      - name: The doc-scope layer's own pass/fail cases
        run: python3 scripts/docset.py --selftest
      # #266: a `path:NNN` anchor must name a file of this tree *and* a real line of
      # it, and — when the anchor names a symbol — that symbol must be in the file
      # the anchor points at. The historical records whose anchors cite a pre-split
      # revision are frozen inside the script, each with a reason; an exemption that
      # no longer covers anything fails, so the frozen set only shrinks. A docs+
      # source audit needs no toolchain and no GPU.
      - name: Every `path:NNN` anchor must resolve to a real line
        run: python3 scripts/check_doc_line_anchors.py
      - name: The doc-line-anchor checker's own pass/fail cases
        run: python3 scripts/check_doc_line_anchors.py --selftest
      # #641: a derived count in a live document must name the revision it measured
      # (`docs/GATE-CONTRACT.md` §"Counts"). No gate can check that a number is
      # *right*; this one checks that the sentence says which tree it is right about —
      # #219 corrected a batch of them and #636 found three wrong sixteen days later.
      # #700 widened it to a line count of 1,000 or more with no path beside it,
      # the shape four tutorial sites used to slip past the path arms.
      - name: A derived count in a live document must name its revision
        run: python3 scripts/check_doc_counts.py
      - name: The doc-count checker's own pass/fail cases
        run: python3 scripts/check_doc_counts.py --selftest
      # #684: a backticked commit hash is the third locator class — neither a relative
      # link (`check_docs_links.py`) nor a `path:NNN` anchor (`check_doc_line_anchors.py`)
      # — so `git cat-file -t` is the only check that sees it. A hash that resolves must
      # name a *commit HEAD can reach*; one that does not must say so, in
      # `scripts/doc-hashes.toml` (one entry per hash, with a source and a reason) or
      # through a document marker that excuses its unresolvable hashes and never a
      # resolvable one (#685's narrowing). Both ratchet. The checkout's `fetch-depth: 0`
      # is load-bearing here too: a shallow clone cannot tell "never existed" from
      # "never fetched", and the checker exits 2 rather than passing on that ambiguity.
      - name: A document's commit hash must resolve or say it is history
        run: python3 scripts/check_doc_hashes.py
      - name: The hash-citation checker's own pass/fail cases
        run: python3 scripts/check_doc_hashes.py --selftest
      # #647: a hand-copied source listing is the artefact that drifts. A fenced block
      # claiming a repo source path must become `{{#rustdoc_include}}`; the ledger is a
      # migration list that can only shrink (a conversion lowers its count here).
      - name: A hand-copied source listing must become an include
        run: python3 scripts/check_doc_code_copies.py
      - name: The code-copy checker's own pass/fail cases
        run: python3 scripts/check_doc_code_copies.py --selftest
      # #643: the reverse index, printed for the author — which live paragraphs cite a
      # file this PR changes. A report, never a gate: "no output" must not read as "no
      # impact", and the enforced half is the PR body's `## Doc impact` section.
      - name: The documents that cite this change
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/doc_impact.py --base "origin/$BASE_REF" --head HEAD
      # #344: resolving is not pointing. A PR that adds or removes lines in a file
      # the docs anchor into shifts every anchor below the edit, and the checker
      # above stays green because the numbers still resolve. This diffs `HEAD`
      # against the *merge base* of the target branch — `origin/<base_ref>...HEAD`
      # is exactly that, and it is why this job's checkout needs `fetch-depth: 0`
      # (the docstring above says why that is required for `check_status.py`; the
      # merge base is the second reason). `origin/<base_ref>` is fetched by
      # actions/checkout at depth 0, so the base is always present in this job.
      - name: An anchor whose target moved must have been re-pointed
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_anchor_drift.py "origin/$BASE_REF"
      # A push to the default branch has no merge base of its own, but the event
      # carries the pre-push tip (`github.event.before`), and diffing against it
      # catches the *combination* drift a per-PR check cannot see — two PRs each
      # green against their own base, the second shifting lines the first had just
      # re-pointed. A force-push rewrites history, so `before` is not an ancestor
      # and no map can be built: that is a loud failure naming both SHAs, never a
      # skip, because a rewrite is exactly when anchors move without a mapping.
      - name: The pushed head descends from the pre-push tip
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "new branch: the pre-push tip is the null SHA, so there is no base to diff"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$BEFORE" HEAD; then
            echo "::error::this push rewrote the branch: $BEFORE is not an ancestor of $(git rev-parse HEAD). The anchor drift map cannot be built; re-run python3 scripts/check_anchor_drift.py $BEFORE by hand and re-point every anchor it reports."
            exit 1
          fi
      - name: An anchor whose target moved must have been re-pointed (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 scripts/check_anchor_drift.py "$BEFORE"
      - name: The anchor-drift checker's own pass/fail cases
        run: python3 scripts/check_anchor_drift.py --selftest
      # #205: the F6 gates compare against fixtures under ~/.cache/minfer/f6-src/
      # that CI does not have, so this job carries the half that needs no bytes —
      # the manifest's shape, the tree cross-check, and the checker's own tamper
      # cases. The byte half is the F6 gates' own fixture verification.
      - name: The F6 fixture manifest must be well formed
        run: python3 scripts/check_f6_fixtures.py --check
      - name: The F6 fixture verifier's own pass/fail cases
        run: python3 scripts/check_f6_fixtures.py --selftest
      # #345: a recorded producer command that cannot be re-run is a dead record,
      # so the manifest has to keep one runnable command per entry (S7 of
      # `--check`). This job has no fixture cache, no built `minfer` and no
      # `llama-quantize`, so the dry run only classifies — RUN, or REFUSED with
      # the reason — and writes nothing; the refusals it prints here are the
      # honest per-box answer, not a failure.
      - name: The F6 producers must stay re-runnable (dry run)
        run: python3 scripts/check_f6_fixtures.py --regenerate --dry-run
      # Same toolchain as Docs (`.github/workflows/docs.yml`), so the gate builds the
      # book the site actually ships: mdBook 0.4.37, and nothing else — the diagrams
      # are inline SVG, so there is no preprocessor to install and no Rust step.
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.37
      - name: Build the book
        run: scripts/build_book.sh
      # #515: the build above cannot fail on the two ways a link dies in the *rendered*
      # book, because both are mdBook's normal behaviour — a chapter named `README.md`
      # is published as `index.html` while the link text is rewritten to `README.html`,
      # and a document that is not in `docs/SUMMARY.md` is not published at all (a
      # source file with no SUMMARY entry is dropped silently; a SUMMARY entry with no
      # file is silently rendered as an empty draft page). `check_docs_links.py`
      # resolves against the checkout, so it is green either way. This reads `book/`.
      - name: Every link in the rendered book must resolve
        run: python3 scripts/check_book_links.py
      - name: The book-link checker's own pass/fail cases
        run: python3 scripts/check_book_links.py --selftest
      # #515, the other half: `SUMMARY.md` is mdBook's only list of chapters, so a
      # `docs/**.md` it omits is never published (silently — exit 0), and a SUMMARY
      # entry whose file is gone is silently rendered as an empty draft page. The
      # documents that are deliberately not chapters are in a reasoned ledger.
      - name: Every document must be a chapter or a reasoned exclusion
        run: python3 scripts/check_book_coverage.py
      - name: The book-coverage checker's own pass/fail cases
        run: python3 scripts/check_book_coverage.py --selftest
      - name: The link checker's own pass/fail cases
        run: python3 scripts/check_docs_links.py --selftest
      # The figures are linted from the source, not from the rendered page: the theme palette
      # (W310), the geometry (W304), the include/caption shape, the character allowlist, the
      # wrapper CSS wiring (W309) and label width at the viewBox edge (W311). Vendored from the
      # `mdbook-figures` skill; scripts/check_figures_tests.py is its own fixture suite.
      - name: Every figure must follow the book's figure rules
        run: python3 scripts/check_figures.py --root . --strict
      - name: The figure checker's own pass/fail cases
        run: python3 scripts/check_figures_tests.py
      # `--sidebar-fg` is the *sidebar's* text colour, not a muted body colour: mdBook
      # 0.4.37's `rust` theme sets it to #c8c9db while that theme's `--quote-bg` card is
      # light grey (#c1c1bd), so a label or caption in it is nearly invisible there. The
      # source-level checker cannot see this (the variable is legal), so it is a grep.
      # It matches the *use* (`var(--sidebar-fg`), not the name, so the explanation in
      # docs/css/figures.css does not trip it. Figures paint secondary labels with
      # `var(--fg)` plus an opacity instead.
      - name: Figure labels must not use the sidebar's text colour
        run: |
          if grep -rn -- 'var(--sidebar-fg' docs/figures/ docs/css/figures.css; then
            echo "figure text: use var(--fg) with an opacity, not --sidebar-fg (see docs/css/figures.css)" >&2
            exit 1
          fi

  # The viz gate: the shape-flow model must agree with the engine's own export, both
  # render paths must survive a headless boot (e2e.js and app.js), and everything the
  # pages pull in from outside must be fresh — assets through the page's own stamped
  # loader (#103), runtime JSON through a revalidating fetch (#546). `node` is
  # preinstalled on the runner image; adding `actions/setup-node@v4` would drag in the
  # Node.js 20 runtime the header comment warns about.
  check-viz:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-24.04 # pinned, like release.yml: `ubuntu-latest` migrates to Ubuntu 26 and emits a deprecation annotation
    steps:
      - uses: actions/checkout@v5
      - name: Shapes must match every exported sample graph
        run: node scripts/check_viz_e2e.mjs
      - name: The animation must boot and play every step headlessly
        run: node scripts/check_viz_e2e_render.mjs
      - name: The operator view must boot and render a sample headlessly
        run: node scripts/check_viz_app.mjs
      - name: The freshness checker's own pass/fail cases
        run: node scripts/check_viz_assets.mjs --selftest
      - name: Assets must use the stamped loader, and runtime fetches must revalidate
        run: node scripts/check_viz_assets.mjs

  # The workflow gate (#178, #215). `scripts/lint_workflows.sh` pins actionlint
  # 1.7.12 and shellcheck 0.10.0 by release tarball *and* per-architecture sha256,
  # and refuses to lint unverified bytes; actionlint's shell integration is on,
  # against the pinned shellcheck rather than the runner's. No toolchain, no
  # cache: one checkout and one step.
  lint-workflows:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-24.04 # pinned, like release.yml: `ubuntu-latest` migrates to Ubuntu 26 and emits a deprecation annotation
    steps:
      - uses: actions/checkout@v5
      - name: Every workflow file must lint clean
        run: scripts/lint_workflows.sh

  # The PR-body gate (#175): the two facts the gate contract asks a PR to state
  # in prose — the bar named *before* measuring and the mutation evidence — have
  # a mechanical floor. `--selftest` runs the checker's own cases first, so a
  # broken checker cannot silently pass every body; then the real body is handed
  # over through `env:` and read with `--body-env`. Interpolating
  # `${{ github.event.pull_request.body }}` into a `run:` command would be a
  # script-injection hazard, and a PR body is attacker-controlled text.
  #
  # The same job owns the ninth, conditional heading (#643): when the classifier says a
  # live document cites a changed file, the body must carry a filled `## Doc impact`
  # section — the only mechanism a semantic drift can have, because no checker can read
  # the sentence. `N/A — <reason>` is a filled section.
  #
  # `if:` keeps the job off a push to master, where there is no PR body, and it is
  # deliberately *not* guarded against `edited`: re-reading the edited body is the
  # whole reason `edited` is in the trigger `types:` (#177). No API token and no
  # network: `gh` is never called, so the job works for a fork PR.
  check-pr-body:
    # #539: the ADR question. When the range touches a path an ADR governs (or adds a
    # design document), the body must answer it on one line — which ADR this implements,
    # which it supersedes, or `none — <reason>`. `presence, not truth` holds here too:
    # the checker can force the sentence to exist, never to be right.
    #
    # This job classifies the range itself rather than `needs: changes`, and that is a
    # deliberate difference from every code job: `changes` is skipped on a `pull_request`
    # **edited** event (a body edit cannot change which code jobs should run), and an
    # edited body is exactly what must be re-checked — a job that `needs` a skipped one is
    # skipped too, which would let a failing body be "fixed" by an edit that never runs
    # the check. The classifier's own fail-safe is reused: if it cannot read the range, the
    # answer is `true` and the question is asked.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04 # pinned, like release.yml: `ubuntu-latest` migrates to Ubuntu 26 and emits a deprecation annotation
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the classifier's three-dot range needs the merge base
      - name: Classify the range for the ADR question
        id: decision
        env:
          BASE_REF: ${{ github.base_ref }}
          SHA: ${{ github.sha }}
        run: |
          OUT=$(python3 scripts/classify_changes.py --base "origin/$BASE_REF" --head "$SHA") \
            || OUT=$(printf 'decision_surface=true\ndoc_cited=true\nmetal=true\n')
          SURFACE=$(printf '%s\n' "$OUT" | sed -n 's/^decision_surface=//p')
          # The decisions the range answers to, so the checker's failure names them
          # (#541). One line, and empty when the range touches no governed surface.
          QUESTION=$(printf '%s\n' "$OUT" | sed -n 's/^adr_question=//p')
          # #643: does a live document cite a file this range changes? The fail-safe is
          # the same as the ADR question's — an unreadable range asks, never assumes.
          CITED=$(printf '%s\n' "$OUT" | sed -n 's/^doc_cited=//p')
          # #678: does the range touch a path only a Metal device can validate? CI has
          # none (#674), so the PR body must then carry the MacBook's record.
          METAL=$(printf '%s\n' "$OUT" | sed -n 's/^metal=//p')
          {
            echo "surface=${SURFACE:-true}"
            echo "question=$QUESTION"
            echo "cited=${CITED:-true}"
            echo "metal=${METAL:-true}"
          } >> "$GITHUB_OUTPUT"
      - name: The checker's own pass/fail cases
        run: python3 scripts/check_pr_body.py --selftest
      - name: The PR body must carry both gate sections, filled
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          DECISION_SURFACE: ${{ steps.decision.outputs.surface }}
          ADR_QUESTION: ${{ steps.decision.outputs.question }}
          DOC_CITED: ${{ steps.decision.outputs.cited }}
          METAL: ${{ steps.decision.outputs.metal }}
        run: |
          python3 scripts/check_pr_body.py --body-env PR_BODY \
            --decision-surface "$DECISION_SURFACE" --adr-question "$ADR_QUESTION" \
            --doc-cited "$DOC_CITED" --metal "$METAL"
