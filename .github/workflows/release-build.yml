# Reusable build body for the two publishers — this file is never triggered on
# its own.
#
# Callers:
#   - `.github/workflows/release.yml`  — a `v*` tag push (the real release)
#   - `.github/workflows/nightly.yml`  — the nightly rolling pre-release
#
# Both create the GitHub Release *first* and then call this workflow, whose three
# per-platform jobs build, smoke-test, package and `gh release upload --clobber`
# their tarball into it. The upload is the only publish step here; the release
# itself (title, notes, prerelease flag, tag) is the caller's business.
#
# Published targets:
#   - macOS arm64 (Apple Silicon runner).
#   - Linux x86_64 CUDA + statically-linked cudart — NVIDIA's CUDA 12.8.2 devel
#     image on an Ubuntu 24.04 base (`nvidia/cuda:12.8.2-devel-ubuntu24.04`), the
#     same image `ci.yml`'s `build-linux-cuda` compile check runs in. Keeps the
#     Volta V100 sm_70/72 targets (CUDA 13 removed them) and reaches sm_120, on
#     the image's glibc 2.39 floor.
#   - Linux arm64 CUDA + statically-linked cudart — NVIDIA's CUDA 13.0.3 devel
#     image, same Ubuntu 24.04 base (`nvidia/cuda:13.0.3-devel-ubuntu24.04`), on
#     the aarch64 runner. The DGX Spark GB10 is sm_121, which CUDA 12.x cannot
#     build (it dropped sm_121), so 13 is required for native Spark SASS.
#
# Both image tags carry the toolkit the apt repositories were already resolving:
# `12.8.2-devel` ships cudart 12.8.90-1 and `13.0.3-devel` ships 13.0.96-1 — the
# exact versions the pre-container jobs got from `cuda-toolkit-12-8 12.8.2-1` and
# `cuda-toolkit-13-0 13.0.3-1`. Moving into the images therefore pinned the
# toolkit without changing which one the artifacts are built against.
#
# The three jobs are independent and run in parallel. To add a target, add a job
# here and nothing in the callers changes.
#
# Inputs:
#   ref         — the commit to build (the caller's `github.sha`, or the nightly's
#                 resolved commit). Passed explicitly so the build is pinned to
#                 one commit rather than to whatever the caller's default is.
#   version     — the `MINFER_VERSION` string compiled into the binary; the
#                 `--version` smoke test asserts the binary prints exactly this.
#   release_tag — the already-existing release to upload the assets into.
#   asset_tag   — the tag used in the tarball file names. It differs from
#                 `release_tag` for the nightly: the release is always tagged
#                 `nightly` (so the download URL is stable), while the assets are
#                 named `minfer-nightly-*`.

name: Release build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        required: true
        type: string
      version:
        description: MINFER_VERSION string baked into the binary
        required: true
        type: string
      release_tag:
        description: Existing release to upload the assets into
        required: true
        type: string
      asset_tag:
        description: Tag used in the tarball file names
        required: true
        type: string

permissions:
  contents: write # `gh release upload` into the release the caller created

jobs:
  macos-arm64:
    name: Build & upload (macOS arm64)
    runs-on: macos-14 # Apple Silicon (arm64) GitHub-hosted runner
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust (pinned 1.97.1)
        uses: dtolnay/rust-toolchain@1.97.1

      # Cache `~/.cargo` + `target/`. What this removes is the from-scratch
      # compile of the whole crates.io tree (tokio, axum, regex, …), which every
      # run paid in full before this step existed.
      #
      # What it deliberately does NOT remove, so nobody expects it to:
      # `rust-cache` persists dependency artifacts only — the workspace crate and
      # its build-script output are cleaned before the cache is saved. Since
      # `build.rs` also declares `cargo:rerun-if-env-changed=MINFER_VERSION` (the
      # version string changes on every tag and every night), the build script
      # re-runs and its `nvcc` compile + arch probes re-run with it, cache hit or
      # not. Caching the kernel object would need a build.rs change (or a
      # dedicated cache keyed on the `.cu` hash) and is a separate follow-up.
      #
      # The default key includes the job id, so the three platform jobs never
      # share a cache, and the rust-environment hash (Cargo.lock etc.) is stable
      # across nights, so a nightly restores the same key instead of re-uploading.
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        env:
          MINFER_VERSION: ${{ inputs.version }}
        run: cargo build --release

      - name: Smoke-test --version
        run: |
          ./target/release/minfer --version
          test "$(./target/release/minfer --version)" = "minfer ${{ inputs.version }}"

      - name: Package
        env:
          ASSET_TAG: ${{ inputs.asset_tag }}
        run: |
          mkdir -p dist
          cp target/release/minfer dist/minfer
          tar -czf "minfer-${ASSET_TAG}-macos-arm64.tar.gz" -C dist minfer
          shasum -a 256 "minfer-${ASSET_TAG}-macos-arm64.tar.gz" > "minfer-${ASSET_TAG}-macos-arm64.tar.gz.sha256"
          ls -lh "minfer-${ASSET_TAG}-macos-arm64.tar.gz"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_TAG: ${{ inputs.asset_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            "minfer-${ASSET_TAG}-macos-arm64.tar.gz" \
            "minfer-${ASSET_TAG}-macos-arm64.tar.gz.sha256" \
            --clobber

  # Linux x86_64, CUDA + statically-linked cudart. Runs in NVIDIA's CUDA 12.8.2
  # devel image on an Ubuntu 24.04 base — deliberately the *same* image ci.yml's
  # `build-linux-cuda` compile check uses, so a green check there is evidence
  # about this artifact instead of about a different glibc/gcc/toolkit. The base
  # in the tag is the artifact's glibc/gcc floor, so it must stay 24.04 (2.39 /
  # gcc 13), matching the target OS.
  #
  # The toolkit is baked into the image, so unlike the apt-era job there is no
  # `apt-get install cuda-toolkit-*` here: that install was this job's slowest
  # and least stable step (measured 125–179 s across x64 runs) and it pinned no
  # version the image does not already pin (12.8.2 / cudart 12.8.90-1 is what it
  # resolved anyway). What the image lacks and this job needs is `gh` for the
  # upload (Ubuntu noble ships 2.45.0 — the same binary the runner-based jobs
  # had), and the image ships no `git` at all, which is why the upload step sets
  # `GH_REPO` (see the note there). The job is root, so there is no `sudo` to
  # reach for. The host needs a GPU only at RUNTIME, never to build.
  #
  # CUDA 12.8 is chosen deliberately: it is the last toolkit whose nvcc still
  # accepts the Volta compute targets (sm_70/72, added to build.rs for
  # V100/Titan-V) AND the first to reach Blackwell (sm_120/121, RTX 50); CUDA 13
  # removed Volta. The `cuda_static` feature links libcudart_static.a, so the
  # artifact has no libcudart.so NEEDED dependency and only needs the NVIDIA
  # driver at runtime.
  linux-x64-cuda:
    name: Build & upload (Linux x86_64 CUDA, static cudart)
    runs-on: ubuntu-24.04 # x86_64; the container's base (24.04) sets the glibc floor (2.39)
    container: nvidia/cuda:12.8.2-devel-ubuntu24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      # The CUDA devel image is minimal: no curl (dtolnay/rust-toolchain
      # bootstraps rustup with it), no host compiler (nvcc needs one, and build.rs
      # probes for it), no git and no gh. `curl ca-certificates build-essential`
      # is exactly the set ci.yml's CUDA job installs; `gh` is this job's extra.
      # The version lines are the artifact's compile-time floor (base 24.04 →
      # glibc 2.39 / gcc 13), printed so a log reader does not have to take the
      # tag on trust.
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates build-essential gh
          gh --version
          ldd --version | head -1
          gcc --version | head -1
          /usr/local/cuda/bin/nvcc --version | tail -1

      - name: Install Rust (pinned 1.97.1)
        uses: dtolnay/rust-toolchain@1.97.1

      # Cache `~/.cargo` + `target/`. What this removes is the from-scratch
      # compile of the whole crates.io tree (tokio, axum, regex, …), which every
      # run paid in full before this step existed.
      #
      # What it deliberately does NOT remove, so nobody expects it to:
      # `rust-cache` persists dependency artifacts only — the workspace crate and
      # its build-script output are cleaned before the cache is saved. Since
      # `build.rs` also declares `cargo:rerun-if-env-changed=MINFER_VERSION` (the
      # version string changes on every tag and every night), the build script
      # re-runs and its `nvcc` compile + arch probes re-run with it, cache hit or
      # not. Caching the kernel object would need a build.rs change (or a
      # dedicated cache keyed on the `.cu` hash) and is a separate follow-up.
      #
      # The default key includes the job id, so the three platform jobs never
      # share a cache, and the rust-environment hash (Cargo.lock etc.) is stable
      # across nights, so a nightly restores the same key instead of re-uploading.
      #
      # Running this job in a container changes that hash exactly once: the
      # container's `CARGO_HOME` (`/github/home/.cargo`, set by
      # `dtolnay/rust-toolchain`) is part of the environment rust-cache hashes, so
      # the first container run misses the runner-era cache — measured on the
      # probe run, key `…-60171389-a16f3a8b` against the runner's
      # `…-7f7ca0a9-a16f3a8b`, "No cache found" — and pays one full dependency
      # compile. Every container run after it hits the new key again.
      - uses: Swatinem/rust-cache@v2

      - name: Build (CUDA + static cudart)
        env:
          MINFER_VERSION: ${{ inputs.version }}
          CUDA_HOME: /usr/local/cuda
        run: cargo build --release --features cuda,cuda_static

      - name: Verify static cudart (no libcudart.so NEEDED)
        run: |
          if readelf -d target/release/minfer | grep -qi cudart; then
            echo "::error::binary still NEEDED libcudart.so — cudart is not static"
            exit 1
          fi
          echo "OK: no libcudart.so dependency"

      - name: Smoke-test --version
        run: |
          ./target/release/minfer --version
          test "$(./target/release/minfer --version)" = "minfer ${{ inputs.version }}"

      - name: Package
        env:
          ASSET_TAG: ${{ inputs.asset_tag }}
        run: |
          mkdir -p dist
          cp target/release/minfer dist/minfer
          tar -czf "minfer-${ASSET_TAG}-linux-x64-cuda.tar.gz" -C dist minfer
          sha256sum "minfer-${ASSET_TAG}-linux-x64-cuda.tar.gz" > "minfer-${ASSET_TAG}-linux-x64-cuda.tar.gz.sha256"
          ls -lh "minfer-${ASSET_TAG}-linux-x64-cuda.tar.gz"

      # `GH_REPO` is not decoration: without it `gh` resolves the repository by
      # shelling out to `git`, and this job has no git repository to find — the
      # checkout step runs before any apt step, in an image that ships no `git`,
      # so `actions/checkout` falls back to its REST-archive mode and leaves no
      # `.git`. The two probe runs failed exactly here: the first with "unable to
      # find git executable in PATH", the second — after `git` had been installed,
      # which is too late for the checkout that already ran — with "failed to run
      # git: fatal: not a git repository". With `GH_REPO` set, `gh release upload`
      # does not touch git at all (verified locally with the same gh 2.45.0 in a
      # non-git directory: exit 0, and the asset is listed on the release).
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_TAG: ${{ inputs.asset_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            "minfer-${ASSET_TAG}-linux-x64-cuda.tar.gz" \
            "minfer-${ASSET_TAG}-linux-x64-cuda.tar.gz.sha256" \
            --clobber

  # Linux arm64 (aarch64), CUDA + statically-linked cudart. Targets the NVIDIA
  # DGX Spark (GB10, sm_121), which is aarch64 with an ARM GPU. Runs in NVIDIA's
  # CUDA 13.0.3 devel image on the same Ubuntu 24.04 base as the x64 job: sm_121
  # (GB10) is not reachable from CUDA 12.x at all, so 13 is required for native
  # Spark SASS, and the base keeps the glibc 2.39 floor the Spark's own Ubuntu
  # 24.04 has. The arm64 image is the sbsa variant of the tag, i.e. the packages
  # the old apt step pulled from the very same `ubuntu2404/sbsa` repository.
  #
  # Same container mechanics as the x64 job, for the same reasons: the toolkit is
  # baked in, so `apt-get install cuda-toolkit-13-0` is gone (measured at 2m38s in
  # the last apt-based night against ~74 s of image pull plus ~10 s of
  # prerequisites), and `gh` + `GH_REPO` cover the upload.
  linux-arm64-cuda:
    name: Build & upload (Linux arm64 CUDA, static cudart)
    runs-on: ubuntu-24.04-arm # aarch64; the container's base (24.04) sets the glibc floor (2.39)
    container: nvidia/cuda:13.0.3-devel-ubuntu24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      # Same set as the x64 job — see the note there for why each one is needed.
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates build-essential gh
          gh --version
          ldd --version | head -1
          gcc --version | head -1
          /usr/local/cuda/bin/nvcc --version | tail -1

      - name: Install Rust (pinned 1.97.1)
        uses: dtolnay/rust-toolchain@1.97.1

      # Cache `~/.cargo` + `target/`. What this removes is the from-scratch
      # compile of the whole crates.io tree (tokio, axum, regex, …), which every
      # run paid in full before this step existed.
      #
      # What it deliberately does NOT remove, so nobody expects it to:
      # `rust-cache` persists dependency artifacts only — the workspace crate and
      # its build-script output are cleaned before the cache is saved. Since
      # `build.rs` also declares `cargo:rerun-if-env-changed=MINFER_VERSION` (the
      # version string changes on every tag and every night), the build script
      # re-runs and its `nvcc` compile + arch probes re-run with it, cache hit or
      # not. Caching the kernel object would need a build.rs change (or a
      # dedicated cache keyed on the `.cu` hash) and is a separate follow-up.
      #
      # The default key includes the job id, so the three platform jobs never
      # share a cache, and the rust-environment hash (Cargo.lock etc.) is stable
      # across nights, so a nightly restores the same key instead of re-uploading.
      # Running in a container changes that hash once — the x64 job's comment
      # spells out why (its `CARGO_HOME` is `/github/home/.cargo`) — so the first
      # container night pays one dependency compile and later nights hit.
      - uses: Swatinem/rust-cache@v2

      - name: Build (CUDA + static cudart)
        env:
          MINFER_VERSION: ${{ inputs.version }}
          CUDA_HOME: /usr/local/cuda
        run: cargo build --release --features cuda,cuda_static

      - name: Verify static cudart (no libcudart.so NEEDED)
        run: |
          if readelf -d target/release/minfer | grep -qi cudart; then
            echo "::error::binary still NEEDED libcudart.so — cudart is not static"
            exit 1
          fi
          echo "OK: no libcudart.so dependency"

      - name: Smoke-test --version
        run: |
          ./target/release/minfer --version
          test "$(./target/release/minfer --version)" = "minfer ${{ inputs.version }}"

      - name: Package
        env:
          ASSET_TAG: ${{ inputs.asset_tag }}
        run: |
          mkdir -p dist
          cp target/release/minfer dist/minfer
          tar -czf "minfer-${ASSET_TAG}-linux-arm64-cuda.tar.gz" -C dist minfer
          sha256sum "minfer-${ASSET_TAG}-linux-arm64-cuda.tar.gz" > "minfer-${ASSET_TAG}-linux-arm64-cuda.tar.gz.sha256"
          ls -lh "minfer-${ASSET_TAG}-linux-arm64-cuda.tar.gz"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_TAG: ${{ inputs.asset_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            "minfer-${ASSET_TAG}-linux-arm64-cuda.tar.gz" \
            "minfer-${ASSET_TAG}-linux-arm64-cuda.tar.gz.sha256" \
            --clobber
