# Release workflow (GitHub Flow: tag → build → publish).
#
# Triggered by pushing a new "v*" tag (e.g. `git tag v0.0.1 && git push origin v0.0.1`).
# Builds the release binary, generates a changelog from the commits since the
# previous "v*" tag (full history for the very first release), and publishes a
# GitHub Release with the artifact + changelog attached.
#
# Currently only macOS arm64 is published. To add more targets later, either
# extend the job matrix below or add new jobs per platform.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed for `gh release create`

jobs:
  release-macos-arm64:
    name: Build & release (macOS arm64)
    runs-on: macos-14 # Apple Silicon (arm64) GitHub-hosted runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so `git describe` can resolve the most
          # recent "v"-prefixed release tag.
          fetch-depth: 0

      - name: Compute version
        id: version
        shell: bash
        run: |
          # Version rule: the most recent release tag matching "v*" (for a
          # tag-triggered build this is the pushed tag itself), plus the
          # short build commit hash, e.g. "v0.0.1(1234abc)".
          TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "${GITHUB_REF_NAME}")"
          SHA="$(git rev-parse --short=7 HEAD)"
          echo "value=${TAG}(${SHA})" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${TAG}(${SHA})"

      - name: Build release binary
        env:
          MINFER_VERSION: ${{ steps.version.outputs.value }}
        run: cargo build --release

      - name: Smoke-test --version
        run: |
          ./target/release/minfer --version
          test "$(./target/release/minfer --version)" = "minfer ${{ steps.version.outputs.value }}"

      - name: Package
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          cp target/release/minfer dist/minfer
          tar -czf "minfer-${TAG}-macos-arm64.tar.gz" -C dist minfer
          shasum -a 256 "minfer-${TAG}-macos-arm64.tar.gz" > "minfer-${TAG}-macos-arm64.tar.gz.sha256"
          ls -lh "minfer-${TAG}-macos-arm64.tar.gz"

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          # Previous "v*" tag reachable from this tag's parent, excluding the
          # current one. Empty for the very first release (no prior tag yet).
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*' --exclude "${TAG}" "${TAG}^" 2>/dev/null \
                      || git describe --tags --abbrev=0 --match 'v*' --exclude "${TAG}" 2>/dev/null \
                      || true)"

          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..${TAG}"
            echo "Changelog range: ${RANGE}"
          else
            RANGE=""
            echo "First release — changelog covers the full history"
          fi

          # Commits in range (all history for the first release), one line each.
          ALL="$(git log --format='%h %s' --no-merges ${RANGE})"

          # Group by conventional-commit prefix; everything else → Other.
          CAT_FEATURES="$(printf '%s\n' "${ALL}" | grep -Ei '^[0-9a-f]+ feat' || true)"
          CAT_FIXES="$(printf '%s\n' "${ALL}" | grep -Ei '^[0-9a-f]+ fix' || true)"
          CAT_PERF="$(printf '%s\n' "${ALL}" | grep -Ei '^[0-9a-f]+ perf' || true)"
          CAT_DOCS="$(printf '%s\n' "${ALL}" | grep -Ei '^[0-9a-f]+ docs' || true)"
          CAT_REFACTOR="$(printf '%s\n' "${ALL}" | grep -Ei '^[0-9a-f]+ refactor' || true)"
          CAT_TESTS="$(printf '%s\n' "${ALL}" | grep -Ei '^[0-9a-f]+ test' || true)"
          CAT_CHORE="$(printf '%s\n' "${ALL}" | grep -Ei '^[0-9a-f]+ chore' || true)"
          CAT_OTHER="$(printf '%s\n' "${ALL}" | grep -vEi '^[0-9a-f]+ (feat|fix|perf|docs|refactor|test|chore)' || true)"

          {
            echo "## What's Changed"
            echo ""
            if [ -z "${PREV_TAG}" ]; then
              echo "_First release — changelog covers the full history._"
              echo ""
            fi
            append() { # $1 = heading, $2 = commit lines
              if [ -n "$2" ]; then
                echo "### $1"
                printf '%s\n' "$2" | sed 's/^/- /'
                echo ""
              fi
            }
            append "🚀 Features" "${CAT_FEATURES}"
            append "🐛 Bug Fixes" "${CAT_FIXES}"
            append "⚡ Performance" "${CAT_PERF}"
            append "📚 Documentation" "${CAT_DOCS}"
            append "♻️ Refactor" "${CAT_REFACTOR}"
            append "🧪 Tests" "${CAT_TESTS}"
            append "🔧 Chores" "${CAT_CHORE}"
            append "📦 Other Changes" "${CAT_OTHER}"
            if [ -z "${ALL}" ]; then
              echo "_No commits in this release._"
            fi
          } > CHANGELOG.md

          echo "--- CHANGELOG.md (first 40 lines) ---"
          head -40 CHANGELOG.md
          echo "commit count: $(printf '%s\n' "${ALL}" | grep -c . || true)"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            "minfer-${TAG}-macos-arm64.tar.gz" \
            "minfer-${TAG}-macos-arm64.tar.gz.sha256" \
            --title "${TAG}" \
            --notes-file CHANGELOG.md
