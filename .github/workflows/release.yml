# Release workflow (GitHub Flow: tag → create release → build → upload assets).
#
# Triggered by pushing a new "v*" tag (e.g. `git tag v0.0.1 && git push origin v0.0.1`).
#
# This file owns only the *release*: it computes the version, generates the
# changelog from the commits since the previous "v*" tag (full history for the
# very first release), and creates the GitHub Release. The per-platform build,
# smoke test, packaging and asset upload live in the reusable workflow
# `.github/workflows/release-build.yml`, which the nightly pre-release calls too —
# so a new target is added in one place, not two. See that file for the list of
# published targets.
#
# The release is created before the builds run, so a failing platform leaves the
# release without that asset (the same shape the pre-refactor workflow had for
# the two Linux jobs). Re-running the whole workflow for the same tag is safe:
# the release step turns into an edit and every asset upload uses `--clobber`.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed for `gh release create`

jobs:
  create-release:
    name: Create release + changelog
    runs-on: ubuntu-24.04 # pinned, like ci.yml: `ubuntu-latest` migrates and emits a deprecation annotation
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history + tags so `git describe` can resolve the most
          # recent "v"-prefixed release tag and the changelog range.
          fetch-depth: 0

      - name: Compute version
        id: version
        shell: bash
        run: |
          # Version rule: the most recent release tag matching "v*" (for a
          # tag-triggered build this is the pushed tag itself), plus the
          # short build commit hash, e.g. "v0.0.1(1234abc)".
          TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "${GITHUB_REF_NAME}")"
          SHA="$(git rev-parse --short=7 HEAD)"
          echo "value=${TAG}(${SHA})" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${TAG}(${SHA})"

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          # Previous "v*" tag reachable from this tag's parent, excluding the
          # current one. Empty for the very first release (no prior tag yet).
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*' --exclude "${TAG}" "${TAG}^" 2>/dev/null \
                      || git describe --tags --abbrev=0 --match 'v*' --exclude "${TAG}" 2>/dev/null \
                      || true)"

          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..${TAG}"
            echo "Changelog range: ${RANGE}"
          else
            RANGE=""
            echo "First release — changelog covers the full history"
          fi

          # Commits in range (all history for the first release), one line each.
          ALL="$(git log --format='%h %s' --no-merges ${RANGE})"

          # Group by conventional-commit prefix; everything else → Other.
          CAT_FEATURES="$(printf '%s\n' "${ALL}" | grep -Ei '^[0-9a-f]+ feat' || true)"
          CAT_FIXES="$(printf '%s\n' "${ALL}" | grep -Ei '^[0-9a-f]+ fix' || true)"
          CAT_PERF="$(printf '%s\n' "${ALL}" | grep -Ei '^[0-9a-f]+ perf' || true)"
          CAT_DOCS="$(printf '%s\n' "${ALL}" | grep -Ei '^[0-9a-f]+ docs' || true)"
          CAT_REFACTOR="$(printf '%s\n' "${ALL}" | grep -Ei '^[0-9a-f]+ refactor' || true)"
          CAT_TESTS="$(printf '%s\n' "${ALL}" | grep -Ei '^[0-9a-f]+ test' || true)"
          CAT_CHORE="$(printf '%s\n' "${ALL}" | grep -Ei '^[0-9a-f]+ chore' || true)"
          CAT_OTHER="$(printf '%s\n' "${ALL}" | grep -vEi '^[0-9a-f]+ (feat|fix|perf|docs|refactor|test|chore)' || true)"

          {
            echo "## What's Changed"
            echo ""
            if [ -z "${PREV_TAG}" ]; then
              echo "_First release — changelog covers the full history._"
              echo ""
            fi
            append() { # $1 = heading, $2 = commit lines
              if [ -n "$2" ]; then
                echo "### $1"
                printf '%s\n' "$2" | sed 's/^/- /'
                echo ""
              fi
            }
            append "🚀 Features" "${CAT_FEATURES}"
            append "🐛 Bug Fixes" "${CAT_FIXES}"
            append "⚡ Performance" "${CAT_PERF}"
            append "📚 Documentation" "${CAT_DOCS}"
            append "♻️ Refactor" "${CAT_REFACTOR}"
            append "🧪 Tests" "${CAT_TESTS}"
            append "🔧 Chores" "${CAT_CHORE}"
            append "📦 Other Changes" "${CAT_OTHER}"
            if [ -z "${ALL}" ]; then
              echo "_No commits in this release._"
            fi
          } > CHANGELOG.md

          echo "--- CHANGELOG.md (first 40 lines) ---"
          head -40 CHANGELOG.md
          echo "commit count: $(printf '%s\n' "${ALL}" | grep -c . || true)"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Idempotent so the whole workflow can be re-run for an existing tag
          # (e.g. after one platform's build failed): create the first time,
          # refresh the notes afterwards. The assets themselves are uploaded by
          # `release-build.yml` with `--clobber`.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TAG}" --notes-file CHANGELOG.md
          else
            gh release create "${TAG}" --title "${TAG}" --notes-file CHANGELOG.md
          fi

  build:
    name: Build & upload
    needs: create-release
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: write # the build jobs upload their assets into the release above
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.create-release.outputs.version }}
      release_tag: ${{ needs.create-release.outputs.tag }}
      asset_tag: ${{ needs.create-release.outputs.tag }}
