# Release workflow (GitHub Flow: tag → build → publish).
#
# Triggered by pushing a new "v*" tag (e.g. `git tag v0.0.1 && git push origin v0.0.1`).
# Builds the release binary, generates a changelog from the commits since the
# previous "v*" tag (full history for the very first release), and publishes a
# GitHub Release with the artifact + changelog attached.
#
# Published targets:
#   - macOS arm64 (release-macos-arm64, Apple Silicon runner)  — creates the
#     release + changelog.
#   - Linux x86_64 CUDA with statically-linked cudart
#     (release-linux-x64-cuda) — CUDA 12.8 (keeps Volta V100 sm_70/72 + up to
#     sm_120), glibc 2.39 floor (Ubuntu 24.04).
#   - Linux arm64 CUDA with statically-linked cudart (release-linux-arm64-cuda)
#     — CUDA 13 (the DGX Spark GB10 is sm_121, which CUDA 12.8 cannot build),
#     glibc 2.39 floor.
#   Both Linux jobs run after the macOS job (which created the release) and
#   upload their own artifact to it. To add more targets later, either extend a
#   job matrix below or add new jobs per platform.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed for `gh release create`

jobs:
  release-macos-arm64:
    name: Build & release (macOS arm64)
    runs-on: macos-14 # Apple Silicon (arm64) GitHub-hosted runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so `git describe` can resolve the most
          # recent "v"-prefixed release tag.
          fetch-depth: 0

      - name: Compute version
        id: version
        shell: bash
        run: |
          # Version rule: the most recent release tag matching "v*" (for a
          # tag-triggered build this is the pushed tag itself), plus the
          # short build commit hash, e.g. "v0.0.1(1234abc)".
          TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "${GITHUB_REF_NAME}")"
          SHA="$(git rev-parse --short=7 HEAD)"
          echo "value=${TAG}(${SHA})" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${TAG}(${SHA})"

      - name: Install Rust (pinned 1.97.1)
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Build release binary
        env:
          MINFER_VERSION: ${{ steps.version.outputs.value }}
        run: cargo build --release

      - name: Smoke-test --version
        run: |
          ./target/release/minfer --version
          test "$(./target/release/minfer --version)" = "minfer ${{ steps.version.outputs.value }}"

      - name: Package
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          cp target/release/minfer dist/minfer
          tar -czf "minfer-${TAG}-macos-arm64.tar.gz" -C dist minfer
          shasum -a 256 "minfer-${TAG}-macos-arm64.tar.gz" > "minfer-${TAG}-macos-arm64.tar.gz.sha256"
          ls -lh "minfer-${TAG}-macos-arm64.tar.gz"

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          # Previous "v*" tag reachable from this tag's parent, excluding the
          # current one. Empty for the very first release (no prior tag yet).
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*' --exclude "${TAG}" "${TAG}^" 2>/dev/null \
                      || git describe --tags --abbrev=0 --match 'v*' --exclude "${TAG}" 2>/dev/null \
                      || true)"

          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..${TAG}"
            echo "Changelog range: ${RANGE}"
          else
            RANGE=""
            echo "First release — changelog covers the full history"
          fi

          # Commits in range (all history for the first release), one line each.
          ALL="$(git log --format='%h %s' --no-merges ${RANGE})"

          # Group by conventional-commit prefix; everything else → Other.
          CAT_FEATURES="$(printf '%s\n' "${ALL}" | grep -Ei '^[0-9a-f]+ feat' || true)"
          CAT_FIXES="$(printf '%s\n' "${ALL}" | grep -Ei '^[0-9a-f]+ fix' || true)"
          CAT_PERF="$(printf '%s\n' "${ALL}" | grep -Ei '^[0-9a-f]+ perf' || true)"
          CAT_DOCS="$(printf '%s\n' "${ALL}" | grep -Ei '^[0-9a-f]+ docs' || true)"
          CAT_REFACTOR="$(printf '%s\n' "${ALL}" | grep -Ei '^[0-9a-f]+ refactor' || true)"
          CAT_TESTS="$(printf '%s\n' "${ALL}" | grep -Ei '^[0-9a-f]+ test' || true)"
          CAT_CHORE="$(printf '%s\n' "${ALL}" | grep -Ei '^[0-9a-f]+ chore' || true)"
          CAT_OTHER="$(printf '%s\n' "${ALL}" | grep -vEi '^[0-9a-f]+ (feat|fix|perf|docs|refactor|test|chore)' || true)"

          {
            echo "## What's Changed"
            echo ""
            if [ -z "${PREV_TAG}" ]; then
              echo "_First release — changelog covers the full history._"
              echo ""
            fi
            append() { # $1 = heading, $2 = commit lines
              if [ -n "$2" ]; then
                echo "### $1"
                printf '%s\n' "$2" | sed 's/^/- /'
                echo ""
              fi
            }
            append "🚀 Features" "${CAT_FEATURES}"
            append "🐛 Bug Fixes" "${CAT_FIXES}"
            append "⚡ Performance" "${CAT_PERF}"
            append "📚 Documentation" "${CAT_DOCS}"
            append "♻️ Refactor" "${CAT_REFACTOR}"
            append "🧪 Tests" "${CAT_TESTS}"
            append "🔧 Chores" "${CAT_CHORE}"
            append "📦 Other Changes" "${CAT_OTHER}"
            if [ -z "${ALL}" ]; then
              echo "_No commits in this release._"
            fi
          } > CHANGELOG.md

          echo "--- CHANGELOG.md (first 40 lines) ---"
          head -40 CHANGELOG.md
          echo "commit count: $(printf '%s\n' "${ALL}" | grep -c . || true)"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            "minfer-${TAG}-macos-arm64.tar.gz" \
            "minfer-${TAG}-macos-arm64.tar.gz.sha256" \
            --title "${TAG}" \
            --notes-file CHANGELOG.md

  # Linux x86_64, CUDA + statically-linked cudart. Builds in a plain ubuntu-24.04
  # runner with the CUDA 12.8 toolkit installed via apt — the host needs a GPU
  # only at RUNTIME, never to build. CUDA 12.8 is chosen deliberately: it is the
  # last toolkit whose nvcc still accepts the Volta compute targets (sm_70/72,
  # added to build.rs for V100/Titan-V) AND the first to reach Blackwell
  # (sm_120/121, RTX 50); CUDA 13 removed Volta. The `cuda_static` feature links
  # libcudart_static.a, so the artifact has no libcudart.so NEEDED dependency and
  # only needs the NVIDIA driver at runtime.
  release-linux-x64-cuda:
    name: Build & release (Linux x86_64 CUDA, static cudart)
    # Runs after the macOS job, which created the release, so we can upload to it.
    needs: release-macos-arm64
    runs-on: ubuntu-24.04 # x86_64; sets the glibc floor (2.39) for the artifact
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        shell: bash
        run: |
          TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "${GITHUB_REF_NAME}")"
          SHA="$(git rev-parse --short=7 HEAD)"
          echo "value=${TAG}(${SHA})" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${TAG}(${SHA})"

      - name: Install CUDA toolkit 12.8 (x86_64)
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends cuda-toolkit-12-8
          # cuda-toolkit installs to /usr/local/cuda-12.8 and (usually) symlinks /usr/local/cuda
          if [ ! -x /usr/local/cuda/bin/nvcc ] && [ -x /usr/local/cuda-12.8/bin/nvcc ]; then
            sudo ln -sfn /usr/local/cuda-12.8 /usr/local/cuda
          fi
          echo "CUDA_HOME=/usr/local/cuda" >> "$GITHUB_ENV"
          /usr/local/cuda/bin/nvcc --version | tail -1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Build (CUDA + static cudart)
        env:
          MINFER_VERSION: ${{ steps.version.outputs.value }}
          CUDA_HOME: /usr/local/cuda
        run: cargo build --release --features cuda,cuda_static

      - name: Verify static cudart (no libcudart.so NEEDED)
        run: |
          if readelf -d target/release/minfer | grep -qi cudart; then
            echo "::error::binary still NEEDED libcudart.so — cudart is not static"
            exit 1
          fi
          echo "OK: no libcudart.so dependency"

      - name: Smoke-test --version
        run: |
          ./target/release/minfer --version
          test "$(./target/release/minfer --version)" = "minfer ${{ steps.version.outputs.value }}"

      - name: Package
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          cp target/release/minfer dist/minfer
          tar -czf "minfer-${TAG}-linux-x64-cuda.tar.gz" -C dist minfer
          sha256sum "minfer-${TAG}-linux-x64-cuda.tar.gz" > "minfer-${TAG}-linux-x64-cuda.tar.gz.sha256"
          ls -lh "minfer-${TAG}-linux-x64-cuda.tar.gz"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release upload "${TAG}" \
            "minfer-${TAG}-linux-x64-cuda.tar.gz" \
            "minfer-${TAG}-linux-x64-cuda.tar.gz.sha256" \
            --clobber

  # Linux arm64 (aarch64), CUDA + statically-linked cudart. Targets the NVIDIA
  # DGX Spark (GB10, sm_121), which is aarch64 with an ARM GPU. Built on an
  # arm64 GitHub runner with CUDA 13 — sm_121 (GB10) was REMOVED from CUDA 12.x
  # (only sm_120 is reachable there) so 13 is required for native Spark SASS.
  # The Spark's OS is Ubuntu 24.04 (glibc 2.39), hence the ubuntu-24.04-arm
  # runner for a matching glibc floor.
  release-linux-arm64-cuda:
    name: Build & release (Linux arm64 CUDA, static cudart)
    # Runs after the macOS job (which created the release) so we can upload to it.
    needs: release-macos-arm64
    runs-on: ubuntu-24.04-arm # aarch64; glibc 2.39 (matches the DGX Spark)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        shell: bash
        run: |
          TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "${GITHUB_REF_NAME}")"
          SHA="$(git rev-parse --short=7 HEAD)"
          echo "value=${TAG}(${SHA})" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${TAG}(${SHA})"

      - name: Install CUDA toolkit 13 (aarch64/sbsa)
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends cuda-toolkit-13-0
          # cuda-toolkit installs to /usr/local/cuda-13.0 and (usually) symlinks /usr/local/cuda
          if [ ! -x /usr/local/cuda/bin/nvcc ] && [ -x /usr/local/cuda-13.0/bin/nvcc ]; then
            sudo ln -sfn /usr/local/cuda-13.0 /usr/local/cuda
          fi
          echo "CUDA_HOME=/usr/local/cuda" >> "$GITHUB_ENV"
          /usr/local/cuda/bin/nvcc --version | tail -1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Build (CUDA + static cudart)
        env:
          MINFER_VERSION: ${{ steps.version.outputs.value }}
          CUDA_HOME: /usr/local/cuda
        run: cargo build --release --features cuda,cuda_static

      - name: Verify static cudart (no libcudart.so NEEDED)
        run: |
          if readelf -d target/release/minfer | grep -qi cudart; then
            echo "::error::binary still NEEDED libcudart.so — cudart is not static"
            exit 1
          fi
          echo "OK: no libcudart.so dependency"

      - name: Smoke-test --version
        run: |
          ./target/release/minfer --version
          test "$(./target/release/minfer --version)" = "minfer ${{ steps.version.outputs.value }}"

      - name: Package
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          cp target/release/minfer dist/minfer
          tar -czf "minfer-${TAG}-linux-arm64-cuda.tar.gz" -C dist minfer
          sha256sum "minfer-${TAG}-linux-arm64-cuda.tar.gz" > "minfer-${TAG}-linux-arm64-cuda.tar.gz.sha256"
          ls -lh "minfer-${TAG}-linux-arm64-cuda.tar.gz"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release upload "${TAG}" \
            "minfer-${TAG}-linux-arm64-cuda.tar.gz" \
            "minfer-${TAG}-linux-arm64-cuda.tar.gz.sha256" \
            --clobber
