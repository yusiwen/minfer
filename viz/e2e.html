<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>minfer · end-to-end shape flow</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
  /* Asset freshness (#103). These pages are edited in place and served by a plain
     static server, which sends no `Cache-Control`: the browser may then reuse a
     stylesheet or script for a heuristic freshness window and pair a *fresh page
     with a stale asset* — that is how the "Shape flow" jump broke. So every asset
     URL is stamped at load time instead of carrying a hand-bumped `?v=N`: nothing
     to remember, and no server-side rewrite is needed. `minfer viz` keeps its own
     `no-store` (src/server/viz.rs); the stamp only has to survive that router.
     Written while the parser is still running, so the stylesheet still blocks
     first paint. Keep this loader in sync with the one in viz/index.html. */
  document.write(
    '<script src="theme.js?t=' + Date.now() + '"><\/script>' +
    '<link rel="stylesheet" href="e2e.css?t=' + Date.now() + '">'
  );
</script>
<style>
  /* The toolbar jump to the other view is inlined on purpose: it must look right
     even when the browser still holds a stale style.css (that happened), and the
     rule is three lines. Keep the two copies of this block in sync:
     viz/index.html and viz/e2e.html. */
  a.nav-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 10px;
    border: 1px solid var(--line-2, rgba(216, 222, 233, .18)); border-radius: 6px;
    background: var(--raised, #434c5e); color: var(--fg-2, #d8dee9);
    font: 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    text-decoration: none; white-space: nowrap;
  }
  a.nav-btn:hover { background: var(--raised-2, #4c566a); color: var(--fg, #eceff4); }
  a.nav-btn svg { color: var(--fg-3, #a0aabc); }
</style>

</head>
<body>
<header id="bar">
  <div class="brand">
    <!-- The brand tile: four op nodes around an amber hub, the mark from
         assets/brand. It is the app icon, not a themed glyph, so it carries its own
         colours instead of currentColor. Keep this block in sync with viz/index.html. -->
    <svg class="logo" width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="7.36" fill="#E0A45C"/>
      <g transform="translate(16 16) scale(0.70) translate(-16 -16)">
        <path d="M16.0 10.3V16.0M16.0 21.7V16.0M10.3 16.0H16.0M21.7 16.0H16.0" fill="none" stroke="#17171A" stroke-width="2.3" stroke-linecap="round"/>
        <rect x="12.40" y="1.40" width="7.2" height="7.2" rx="1.9" fill="none" stroke="#17171A" stroke-width="3.4"/>
        <rect x="12.40" y="23.40" width="7.2" height="7.2" rx="1.9" fill="none" stroke="#17171A" stroke-width="3.4"/>
        <rect x="1.40" y="12.40" width="7.2" height="7.2" rx="1.9" fill="none" stroke="#17171A" stroke-width="3.4"/>
        <rect x="23.40" y="12.40" width="7.2" height="7.2" rx="1.9" fill="none" stroke="#17171A" stroke-width="3.4"/>
        <circle cx="16.0" cy="16.0" r="3.0" fill="#17171A"/>
      </g>
    </svg>
    <span class="title">minfer · shape flow</span>
    <span class="subtitle" id="src">built-in profile</span>
  </div>

  <div class="controls">
    <select id="sample" title="Load a pre-generated graph export (needs an http server; “Open File…” works under file://)">
      <option value="">— sample —</option>
    </select>
    <button id="open" title="Load a graph or trace JSON from disk">Open File…</button>
    <input id="file" type="file" accept=".json" hidden>

    <span class="sep"></span>

    <button id="prev" title="Previous step" aria-label="Previous step">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M4.75 3.5v9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M11.5 3.9 6.6 8l4.9 4.1z" fill="currentColor"/>
      </svg>
    </button>
    <button id="play" class="primary" title="Play / pause" aria-label="Play">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M5.4 3.6v8.8a.6.6 0 0 0 .92.5l7-4.4a.6.6 0 0 0 0-1l-7-4.4a.6.6 0 0 0-.92.5Z" fill="currentColor"/>
      </svg>
    </button>
    <button id="next" title="Next step" aria-label="Next step">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M11.25 3.5v9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M4.5 3.9 9.4 8l-4.9 4.1z" fill="currentColor"/>
      </svg>
    </button>
    <button id="restart" title="Restart" aria-label="Restart">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.6V5h-2.4"/>
      </svg>
    </button>
    <input id="speed" type="range" min="1" max="100" value="55" title="Playback speed">
    <span class="dim" id="speedlbl">55</span>

    <span class="sep"></span>

    <div class="seg" id="phase" title="What to play: the full prefill→decode run, or one pass only">
      <button data-mode="run" class="on">Run</button>
      <button data-mode="prefill">Prefill</button>
      <button data-mode="decode">Decode</button>
    </div>
    <label class="chk" title="Include the ×N-layers tick between layer 0 and the epilogue"><input id="layers" type="checkbox" checked> ×N</label>
    <label class="chk" title="Play every node of every decode step instead of one sweep per step"><input id="detail" type="checkbox"> decode detail</label>

    <span class="sep"></span>

    <select id="scheme" data-scheme title="Colour scheme" aria-label="Colour scheme"></select>

    <a id="to-ops" class="nav-btn" href="index.html" title="The operator / pipeline views of the same graph">Operators view
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor"
           stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2.5 8h10M8.5 4.5 12 8l-3.5 3.5"/>
      </svg>
    </a>
  </div>
</header>

<main>
  <div id="stagewrap"><canvas id="cv"></canvas></div>
  <aside id="panel"><div id="panel-body"><div class="placeholder">loading…</div></div></aside>
</main>

<footer id="bottom">
  <div id="kv">
    <div class="kvhead">
      <span id="kvlabel">KV cache</span>
      <span class="dim" id="kvnum">—</span>
    </div>
    <div class="kvbar" title="The KV cache is a persistent [kv_dim, n_ctx] region; each step writes one more column">
      <div id="kvfill"></div>
      <div id="kvwin"></div>
    </div>
  </div>
  <div id="chips" title="Click any step to jump to it"></div>
</footer>

<script>
  /* The same per-load stamp as the loader in <head>, and both tags are written
     here in order: a script the parser inserts runs before the next one is
     inserted, so e2e-model.js still defines E2EModel before e2e.js runs. */
  var assetStamp = '?t=' + Date.now();
  document.write('<script src="e2e-model.js' + assetStamp + '"><\/script>');
  document.write('<script src="e2e.js' + assetStamp + '"><\/script>');
</script>
</body>
</html>
