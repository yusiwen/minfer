# Hand-copied source listings, per document (#647).
#
# A fenced block whose first line names a repository source file is a `transcription
# claim` — the page says "this is src/…, as it was when someone copied it". The fix is
# `{{#rustdoc_include path:anchor}}`: the page renders the source itself, so the listing
# cannot drift from the code. `scripts/check_doc_code_copies.py` reads this file:
#
#   1. a claim in a document with no entry fails (a new copy);
#   2. more claims than `count` fails (a new copy in a migrated page);
#   3. *fewer* claims than `count` fails too — a conversion must lower the number in the
#      same commit, so the population can only shrink;
#   4. an entry whose document carries no claim fails (the ledger may not rot).
#
# These entries are a migration list, not a permission. Each one should disappear when
# its page is next edited: add `// ANCHOR: <name>` markers around the source block, put
# `{{#rustdoc_include path:name}}` in the page, delete the entry's count by one and
# re-run the checker. The frozen records are exempt inside the checker, not here.

