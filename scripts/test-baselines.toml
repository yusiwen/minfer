key = "cuda-unit"
box = "dgxspark (aarch64, GB10 sm_121)"
suite = "unit"
command = "scripts/cuda_test.sh"
date = "2026-10-07"
passed = 576
failed = 0
ignored = 46
# #207: this row is a recorded measurement (CI has no GPU) refreshed only on a
# device run, but it counts the same test binary plus the device-gated tests, so a
# feature-independent test added by a CPU-only ticket moves it too.
# `projection_*` names the CPU row that shares its binary and that row's `passed`
# value at the moment this row was measured; `check_status.py --check` prints
# (never fails on) `passed + (source_passed - projection_base_passed)`. The
# relation is inexact -- the device-gated tests move independently -- which is why
# it is a hint, not a comparison.
projection_key = "cpu-unit"
projection_box = "dgxspark (aarch64, GB10 sm_121)"
projection_base_passed = 488
live_check = false
note = "recorded measurement; CI has no GPU; the refresh over the 2026-10-06 row is #205's three fixture-manifest gates + #349's parity-verdict classifier + #306's format-aware physical-shift gate; #362's platform-neutral test the sixth (575/46 -> 576/46, re-measured on dgxspark 2026-10-07, base moved with it); #354's two platform-neutral manifest-override tests are not re-measured here — the #207 projection prints about 578 passed"
file = "docs/TEST-BASELINES.md"
regex = 'CUDA unit, box `(?P<box>[^`]+)`, `scripts/cuda_test\.sh`, (?P<date>[0-9]{4}-[0-9]{2}-[0-9]{2}): \*\*(?P<passed>[0-9]+) / (?P<failed>[0-9]+) / (?P<ignored>[0-9]+)\*\*'

