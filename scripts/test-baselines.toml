# scripts/test-baselines.toml — the machine-readable source of truth for the suite
# measurements in `docs/TEST-BASELINES.md`.
#
# Every recorded measurement is a **derived fact**: the number is written here, and
# `python3 scripts/check_baselines.py --check` (CI job `check-docs`) fails when the
# prose disagrees, naming the file, the line and both values. The one row whose
# `live_check` is true is *also* compared against the real `cargo test` log by
# `python3 scripts/check_baselines.py --check-live` (CI job `test-linux-cpu`).
# Edit *this* file, not a counter.
#
# It is deliberately not part of `scripts/status.toml`: the plan's counters and
# `next:` sentence have a different prose target and no live consumer, and one file
# per consumer is what lets a change to one half be told from a change to the
# other. The split and the placement rule are recorded in
# `docs/adr/0023-the-machine-ledgers-live-beside-their-checkers.md`.
#
# `kind` declares which half this file is: the checker refuses a file whose kind is
# not `counts`, and refuses a manifest with no `[[counts]]` rows.

schema = 1
kind = "counts"

# --- suite counts, per box --------------------------------------------------
# `box` is the *absolute* name of the machine a row was measured on, never a
# relative `this box` / `local`: an agent reading the record may be on another
# machine (gate contract rule 5). The convention:
#   `dgxspark (aarch64, GB10 sm_121)` — the maintainer's DGX Spark; one physical
#       machine, so the CPU and the CUDA rows share the label.
#   `x86_64 (CI runner)` — GitHub's runner; CPU-only, no GPU and no aarch64.
# The box is part of the identity. `quants::neon_correctness` is
# `cfg(all(test, target_arch = "aarch64"))` (two tests the x86_64 box lacks), and
# since #56 the x86_64 box carries `quants::avx2_correctness` (three gates plus one
# `#[ignore]`d timing harness) that aarch64 lacks, so the x86_64 box now reports
# **one more** unit test than aarch64 (491 vs 490) and one more ignored (41 vs 40) —
# the old "x86_64 = aarch64 - 2" relation is gone. Only `x86_64 (CI runner)` is
# compared live, by `test-linux-cpu`; every other row is a recorded measurement. A
# row's `ignored` count is also a **derivation**, not a measurement, whenever a
# change adds a platform-gated test: #208's Metal half added one `#[ignore]`d
# macOS-only gate (`f208_bf16_weights_run_on_the_metal_device`, a no-op off macOS),
# and #56's x86_64 harness is the second, which raises the ignored count on that box
# without re-running it there. `projection_*` carries only `passed`, so an
# ignored-count move is derived — say so when recording it.

