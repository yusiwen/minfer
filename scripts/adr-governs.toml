# Which ADR governs which code surface, and what it fixes there (#541).
#
# `scripts/check_adr.py` maps, `scripts/adr-citations.toml` and the corpus's shape
# answer "is the record well formed?" and "which document's contract depends on it?".
# Neither answers the question a person changing code actually has: **which decision is
# at stake on this line?** This ledger answers it, one surface at a time, and
# `scripts/classify_changes.py` reads it to make the PR-time question name the decision
# instead of asking "is this an ADR matter?".
#
# A surface is a **path** (the file itself) or a **symbol**, and exactly one of the two
# per entry. The symbol form means "the **definition sites** of this identifier under
# `src/**/*.rs`" — a `fn`/`struct`/`enum`/`trait`/`const`/`static`/`type`/`impl`/`mod`
# that defines it. Merely mentioning the name does not count, and that is measured, not
# assumed: the first draft bound `MINFER_CACHE_TYPE` and `MINFER_PACKED_KV_STAGE` as
# symbols, and a change to one Metal file then matched **eight** bindings, because those
# tokens appear in comments all over the device layer. A name this tree does not *define*
# (a knob, an FFI constant, a kernel symbol) is bound by the file that implements the
# mechanism instead — the weaker form, chosen deliberately over a noisy one.
#
# `scripts/check_adr.py` enforces four things about this file:
#   1. `adr` must exist in the corpus; `what` must be non-empty;
#   2. exactly one of `path` / `symbol` must be present — a binding that names both is
#      ambiguous about which one it means;
#   3. a `path` must exist at the repository root, and a `symbol` must occur in at least
#      one file under `src/` — the ledger may not rot into a list of names nothing holds;
#   4. an entry whose ADR is `Superseded by ADR-NNNN` fails, naming the successor: a
#      superseded decision governs nothing, and the entry must move to the successor.
#
# Coverage is deliberately partial, and the checker prints both numbers. An ADR with no
# code surface is not an omission: a process decision (the corpus, the gates), a scope
# decision (what a round includes) or an upstream decision (the identity gate) is not
# something a diff can violate in a way a binding would catch. What matters is that a
# *code* change to a governed shape names the decision.

