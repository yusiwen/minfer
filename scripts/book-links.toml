# Known-dead links in the rendered book, and why each one stays (#515).
#
# `scripts/check_book_links.py` reads the built `book/` tree and resolves every
# relative link against what mdBook actually published — the half
# `scripts/check_docs_links.py` cannot see, because it resolves against the checkout.
# A link it cannot follow is a failure unless an entry below says why it is known.
#
# The checker enforces three things about this file:
#   1. a dead link that **no entry covers** is a failure (a new one — the site would
#      404 for a reader, and nothing else in CI would say so);
#   2. an entry that **no longer covers a dead link** is a failure (the ledger may not
#      rot: fixing a link means deleting its entry in the same commit);
#   3. `target` and `reason` must both be non-empty.
#
# `target` is a glob over the **book-relative** target: the page's directory joined
# with the `href` and normalised, so the several spellings of one target collapse
# (`./README.html` from a chapter and `cuda_optimization_steps/README.html` from its
# parent are one key). A `#fragment` problem has the key `<page>#<fragment>`, with the
# fragment percent-decoded — mdBook encodes a non-ASCII href while the `id=` it
# generates stays raw, and the browser matches the decoded one.
#
# **The ledger is empty, and that is the point.** It carried the 315 dead links the
# site had when this gate landed (#515), each with the cause and the fix; #516
# re-pointed every one of them — the three chapter `README.md` files became
# `index.md`, the ADR corpus and the campaign records 81-109 became chapters, and the
# links out of the book (the root `README.md`, `AGENTS.md`, the PR template, the
# `viz/` guide and the three `STYLE.md` contracts) became absolute `github.com` URLs.
# It stays empty; a new entry here is a debt, not a policy.
#
# The two fragment failures the checker found on its first run are not recorded here
# either: they were two slug typos in `docs/METAL_OPTIMIZATIONS.md`'s own table of
# contents, fixed in the commit that added the checker.
