# Where every production `MINFER_*` environment variable is documented (#531).
#
# `scripts/check_env_vars.py` enumerates the `std::env::var("MINFER_…")` reads in the
# non-test source (test files excluded by the layout rule `check_source_layout.py`
# already holds) and requires **every** name to appear in exactly one of two tables:
#
#   `[documented]`  name = "<file>"   the file that documents the knob. The checker
#                                     verifies that the file exists, is a live document
#                                     (not one of the dated records listed in the
#                                     script), and actually names the knob — so the
#                                     claim "this is where it is documented" is checked,
#                                     not asserted.
#   `[internal]`    name = "<reason>" no document a reader would find names it, and the
#                                     reason says what it does and where its only
#                                     record is. The checker fails if a live document
#                                     *does* name the knob: the exemption must stay
#                                     necessary.
#
# Both tables ratchet: an entry whose knob is no longer read fails, a `[documented]`
# home that does not contain the name fails, and a knob in neither table fails (the
# #521 class: `MINFER_N_BATCH` was read and printed at every server start while only
# the plan and the roadmap named it).
#
# Prefer `docs/USAGE.md` for a knob a user sets, and the design contract that owns the
# mechanism otherwise (`docs/CUDA-BACKEND-DESIGN.md`, `docs/METAL-BACKEND-DESIGN.md`,
# `docs/COMPUTE-GRAPH-DESIGN.md`, `docs/BACKEND-REGISTRY-DESIGN.md`, …); the walkthrough
# chapters and the tutorials are homes too, and `AGENTS.md`/`README.md` carry the
# build-and-run examples.
#
# Measured 2026-10-11: 84 production reads — 72 documented, 12 internal.

