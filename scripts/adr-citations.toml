# Unresolvable path citations in `docs/adr/`, and why each one stays (ADR-0027).
#
# `scripts/check_adr.py` walks every backticked repository-rooted path in every ADR
# and tests it against the tree. An ADR is immutable, so a path cited at decision
# time can legitimately stop existing — a file moves, a layout is split, a rejected
# option was never created. This file is that set, so the checker can tell **history**
# from **staleness**: without it, the 13 entries below would be 22 spurious failures
# (ADR-0027, Alternatives considered).
#
# The checker enforces three things about this file:
#   1. an unresolvable citation that is **not** listed here is a failure (a new one);
#   2. an entry that **no ADR cites any more** is a failure (the ledger may not rot);
#   3. `kind` must be one of the four below, and `reason` must be non-empty.
#
# Keys are `(adr, path)` and never a line number: a line number drifts on any edit
# above it, which would churn this file on unrelated changes.
#
# Kinds — what makes an unresolvable citation legitimate:
#   historical-before-state  the file as it was *before* the decision — often with the
#                            size or count that was the problem being solved
#   corrected-elsewhere      the path moved, and an errata ADR already says so
#   named-in-the-move        this ADR (or the one it corrects) is the record of the
#                            move, so it must name the location it moved away from
#   rejected-alternative     a path that appears only inside a rejected option and was
#                            never created
#
# Update rule. A new legitimate historical citation is added **in the same PR as the
# migration that invalidates it** — that PR must also produce the errata ADR, because
# ADR-0027 decision 5 puts the ledger update on the cause, not on the later PR that
# trips over it. `check-docs` runs unconditionally, so the friction already lands there.

