# Documents under the book's source tree that are deliberately not chapters (#515).
#
# `docs/SUMMARY.md` is the book's only list of chapters: mdBook publishes what it
# names and silently drops every other `docs/**.md` file. `scripts/check_docs_links.py`
# cannot see that (the link and its target both exist in the checkout) and
# `scripts/check_book_links.py` can only see it for a document the book links to — a
# document nothing links to is invisible to both. `scripts/check_book_coverage.py`
# compares the two sets directly.
#
# The checker enforces three things about this file:
#   1. a `docs/**.md` that is neither a chapter nor covered here is a failure (a new
#      orphan — it would never reach the site and nothing else would say so);
#   2. an entry that covers no document is a failure (the ledger may not rot: when a
#      document becomes a chapter, or is deleted, its entry goes in the same commit);
#   3. `glob` and `reason` must both be non-empty.
#
# `glob` is over the repository-relative path and is matched with `fnmatch`, so `*`
# spans `/`.
#
# **These entries are decisions, not debts.** #516 settled the two questions this file
# used to defer:
#   - **In the book**: the ADR corpus, the CUDA campaign records 81-109, the sampling
#     and template design docs, the server/CLI plans and the T-series device plan —
#     they are the "why" the design documents link to, so they are chapters now;
#   - **out of the book**: the writing contracts (`STYLE.md`), which are contributor
#     material the book links by absolute URL, and the dated debugging/analysis
#     records below, which are repository artifacts rather than book content.
#
# What it must not do is grow by accident.

# Structural: the table of contents itself. mdBook consumes it and never publishes it,
# so it can never be a chapter — not a decision anybody has to revisit.
[[exclude]]
glob = "docs/SUMMARY.md"
reason = "the book's table of contents; mdBook consumes it and publishes no page for it"

# Writing contracts: each is linked from its tutorial's index by an absolute URL, so
# no reader of the book needs the page in the book.
[[exclude]]
glob = "docs/cuda_tutorial/STYLE.md"
reason = "the tutorial's writing contract: contributor material, linked by absolute URL (#516)"

[[exclude]]
glob = "docs/inference_e2e_walkthrough/STYLE.md"
reason = "the walkthrough's writing contract: contributor material, linked by absolute URL (#516)"

[[exclude]]
glob = "docs/cuda_optimization_steps/STYLE.md"
reason = "the campaign's writing contract: contributor material, linked by absolute URL (#516)"

# Dated records kept as repository artifacts: each records one debugging or analysis
# session against the revision of its day, none is linked from the book, and the
# book's "why" for the code they cover lives in the design documents and ADRs (#516).
[[exclude]]
glob = "docs/BUG-6-KV-CACHE-INDEXING.md"
reason = "dated debugging record, kept as a repository artifact (#516)"

[[exclude]]
glob = "docs/DEBUGGING-PLAN.md"
reason = "dated debugging plan, kept as a repository artifact (#516)"

[[exclude]]
glob = "docs/DEBUGGING-SUMMARY.md"
reason = "dated debugging record, kept as a repository artifact (#516)"

[[exclude]]
