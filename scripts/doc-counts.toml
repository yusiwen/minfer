# Live-document exemption ledger for `scripts/check_doc_counts.py` (#641).
#
# `docs/GATE-CONTRACT.md` §"Counts" states the rule: a live document describes
# structure, and a count that is the point of a record carries the revision it
# measured. The checker accepts two forms of that stamp — one on the claim's own line
# (or a neighbour), and one in the document's header (its first 30 lines), which is how
# the walkthrough's `Code:`/`Sizes:` block and every dated record declare their base.
#
# **The ledger holds one entry, not zero.** When the checker landed (#641) every claim
# in the tree was covered by one of the two stamp forms: every record states its
# baseline in its header (`Status: … (2026-09-15)`, `Baseline: HEAD = 293eb19`,
# `Commit: 6df3245`), and the live pages that quote sizes say which revision those sizes
# are from. An entry here would be a way to *hide* a number rather than to date it, so
# there was none. #700 added the path-free arm (a line count of 1,000 or more with no
# path beside it); the 15 claims that arm sees beyond the path arms are 14 stamped or
# header-stamped and the one below, which measures a foreign tree.
#
# It is kept as the escape hatch, under the same constraints as the other ledgers
# (ADR-0023): `glob` + `reason`, both non-empty, and an entry that exempts no claim is
# a failure — the ledger may not rot. A document that genuinely cannot stamp its
# numbers (a table of past sizes with no single base) gets an entry **and** a reason
# that says why a stamp is impossible, not merely inconvenient.
#
# `glob` is over the repository-relative path and is matched with `fnmatch`, so `*`
# spans `/`.

[[exclude]]
glob = "docs/LLAMA-COMPUTE-GRAPH.md"
reason = "its ~3,800-line figure describes llama.cpp's graph framework at its 2026-08 release, a foreign tree this repository does not contain: no commit here can date it, and a llama.cpp hash is not resolvable in this repository (#684)"
