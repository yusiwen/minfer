# Hashes a document cites that cannot resolve here, and why each one stays (#684).
#
# `scripts/check_doc_hashes.py` reads this ledger beside it (ADR-0023). `docs/GATE-CONTRACT.md`
# §"Citations" states the rule: a backticked hash is a locator, and a document that keeps a hash
# which cannot resolve must say so where the checker can read it — in one standalone comment
# above the block it describes (one comment, one paragraph or table),
#
#     <!-- doc-hashes: history -->
#
# or in one entry below. The marker covers *unresolvable* hashes in the block that follows it
# (ADR-0065); the ledger pins a single hash wherever it is cited. Both exist because the classes
# are not the same: a record document may keep a table of pre-rewrite labels as one block, while a
# foreign repository's hash is one fact that belongs in one place, with the repository it came
# from — and a label inside a list item cannot carry a marker without splitting the list, so it
# belongs here.
#
# One entry per hash, never per line: a line number drifts on any edit above it (ADR-0027), and
# the same hash is cited from up to ten documents. `source` says whose history it is, `reason`
# says why it is kept rather than repaired.
#
# The checker enforces four things about this file, so an exemption cannot outlive its reason:
#   1. an unresolvable hash that no marker covers and that is not pinned here fails;
#   2. an entry that **no document cites any more** fails (the ledger may not rot);
#   3. an entry whose hash **resolves now** fails — it is not history any more;
#   4. `kind` must be `foreign` or `pre-rewrite`, and `source`/`reason` must be non-empty.
#
# The marker ratchets the same way: one that covers no unresolvable hash fails, so deleting the
# last pre-rewrite label from a record must also delete its marker.
#
# Population when this landed (2026-10-31, `master` `24626ad`, measured in a fresh clone): 129
# unresolvable occurrences in 58 distinct hashes — 28 occurrences behind the four block markers in
# `METAL_OPTIMIZATIONS.md`, the 35 entries below covering the other 101. An entry here is a
# reviewed exception, not a place to hide a typo: a hash that *should* resolve (a mistyped or
# stale commit of this repository) is repaired, not pinned.
#
# "Unresolvable" means **a commit HEAD cannot reach**, not "an object this clone lacks": an amend
# or a rebase leaves the discarded commit in the object database, so a local `git cat-file -t`
# resolves 14 citations in 10 hashes below that a fresh clone cannot. Those are the amended-away
# twins the CUDA records already describe as unresolvable, and the checker now reads them the
# same way everywhere.

