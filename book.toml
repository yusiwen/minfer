[book]
title = "minfer"
authors = ["Siwen Yu"]
description = "minfer — a minimal local LLM inference engine built from scratch in Rust"
language = "en"
src = "docs"

[build]
build-dir = "book"

[output.html]
# mdbook 0.4.37 has no "dark" theme id (valid: light/rust/coal/navy/ayu);
# an invalid default makes book.js's updateThemeSelected throw at load and
# kills the theme-toggle + sidebar fold handlers. "coal" is the dark one.
default-theme = "coal"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/yusiwen/minfer"
# Figures are inline SVG: one file per figure in docs/figures/, pulled into a page
# with {{#include}} and wrapped in <figure class="book-figure">. There is no
# diagram JavaScript and no preprocessor — the SVG is rendered at build time, so it
# survives a blocked script, an offline reader and the print/PDF route, and it is
# plain text in git (diffable, reviewable in the same commit as the prose).
#
# `additional-css` paths are relative to the *book root* (this file's directory),
# not to `book.src` (docs/) — hence the "docs/css/…" spelling, and the matching
# <link> mdBook emits. An absolute path is NOT an alternative: `Path::join`
# replaces the prefix, so the input and the output become the same file and the
# copy truncates the source (exit 0, nothing emitted).
additional-css = ["docs/css/figures.css"]

[output.html.fold]
enable = true
level = 0
