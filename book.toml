[book]
title = "minfer"
authors = ["Siwen Yu"]
description = "minfer — a minimal local LLM inference engine built from scratch in Rust"
language = "en"
src = "docs"

[build]
build-dir = "book"

[output.html]
# mdbook 0.4.37 has no "dark" theme id (valid: light/rust/coal/navy/ayu);
# an invalid default makes book.js's updateThemeSelected throw at load and
# kills the theme-toggle + sidebar fold handlers. "coal" is the dark one.
default-theme = "coal"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/yusiwen/minfer"
# The two Mermaid assets are NOT committed. `scripts/build_book.sh` downloads
# docs/assets/mermaid.min.js (mermaid 10.6.1, sha384-pinned), writes
# mermaid-init.js, runs mdbook, and deletes both again on exit — including when the
# build fails. Build through that script, not a bare `mdbook build`: on a clean
# checkout the files do not exist and mdBook fails while copying them.
#
# `additional-js` paths are relative to the *book root* (this file's directory)
# and are copied into the output preserving that path — hence the "docs/assets/…"
# spelling, and the matching <script src> mdBook emits. An absolute path is NOT an
# alternative: `Path::join` replaces the prefix, so the input and the output become
# the same file and the copy truncates the source (exit 0, nothing emitted). Because
# docs/ is also the book source, mdBook copies both files a second time as content
# (book/assets/…); the duplicate is confined to the gitignored book/ tree.
additional-js = ["docs/assets/mermaid.min.js", "docs/assets/mermaid-init.js"]

[output.html.fold]
enable = true
level = 0

[preprocessor.mermaid]
command = "mdbook-mermaid"
