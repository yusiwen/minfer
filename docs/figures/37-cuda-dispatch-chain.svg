<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 210" width="100%" style="max-width:100%;height:auto"
     role="img" aria-label="The four hops from a graph Op to a CUDA kernel: Rust match arm, Rust device method, C launcher, then the __global__ kernel.">
  <style>
    .fig-card  { fill: var(--quote-bg, #13293d); stroke: var(--quote-border, #274357); stroke-width: 1; }
    .fig-alt   { fill: var(--table-alternate-bg, #0f2438); stroke: var(--quote-border, #274357); stroke-width: 1; }
    .fig-t     { fill: var(--fg, #dce6f0); font-size: 12.5px; font-weight: 600; }
    .fig-s     { fill: var(--fg, #dce6f0); font-size: 11.5px; opacity: .90; }
    .fig-cap   { fill: var(--fg, #dce6f0); font-size: 11px; letter-spacing: .10em; opacity: .90; }
    .fig-edge  { stroke: var(--quote-border, #3c6b8f); stroke-width: 1.25; fill: none; }
    .fig-a-acc { fill: #4d86b8; }
    .fig-a-pos { fill: #3f8f6f; }
    .fig-a-neg { fill: #b06a5e; }
  </style>
  <defs>
    <marker id="fig37-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--quote-border, #3c6b8f)"/>
    </marker>
  </defs>
  <rect class="fig-card" x="18" y="40" width="172" height="104" rx="8"/>
  <text class="fig-t" x="32" y="66">Rust</text>
  <text class="fig-s" x="32" y="86">Op match arm</text>
  <text class="fig-s" x="32" y="104">graph/</text>
  <text class="fig-s" x="32" y="120">cuda_backend.rs</text>
  <path class="fig-edge" d="M190 92 H 218" marker-end="url(#fig37-arrow)"/>
  <rect class="fig-card" x="220" y="40" width="172" height="104" rx="8"/>
  <text class="fig-t" x="234" y="66">Rust device layer</text>
  <text class="fig-s" x="234" y="86">CudaState method</text>
  <text class="fig-s" x="234" y="104">cuda/methods/</text>
  <text class="fig-s" x="234" y="120">*.rs</text>
  <path class="fig-edge" d="M392 92 H 420" marker-end="url(#fig37-arrow)"/>
  <rect class="fig-card" x="422" y="40" width="172" height="104" rx="8"/>
  <text class="fig-t" x="436" y="66">C launcher</text>
  <text class="fig-s" x="436" y="86">grid sizing</text>
  <text class="fig-s" x="436" y="104">cuda/kernels/</text>
  <text class="fig-s" x="436" y="120">*.cu</text>
  <path class="fig-edge" d="M594 92 H 622" marker-end="url(#fig37-arrow)"/>
  <rect class="fig-card" x="624" y="40" width="172" height="104" rx="8"/>
  <text class="fig-t" x="638" y="66">__global__ kernel</text>
  <text class="fig-s" x="638" y="86">one thread's</text>
  <text class="fig-s" x="638" y="104">worth of math</text>
  <text class="fig-s" x="638" y="120">grid-stride loop</text>
  <text class="fig-s" x="18" y="176">A graph node named Add does not run add_f32 directly: each hop has its own job, and this chain repeats for every Op arm.</text>
</svg>
