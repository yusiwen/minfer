<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 630" width="100%" style="max-width:100%;height:auto"
     role="img" aria-label="How main() parses argv into flags and positionals, branches on positional[0] into the four modes, and resolves the model reference in a fixed order.">
  <style>
    .fig-card  { fill: var(--quote-bg, #13293d); stroke: var(--quote-border, #274357); stroke-width: 1; }
    .fig-alt   { fill: var(--table-alternate-bg, #0f2438); stroke: var(--quote-border, #274357); stroke-width: 1; }
    .fig-t     { fill: var(--fg, #dce6f0); font-size: 12.5px; font-weight: 600; }
    .fig-s     { fill: var(--fg, #dce6f0); font-size: 11.5px; opacity: .90; }
    .fig-cap   { fill: var(--fg, #dce6f0); font-size: 11px; letter-spacing: .10em; opacity: .90; }
    .fig-edge  { stroke: var(--quote-border, #3c6b8f); stroke-width: 1.25; fill: none; }
    .fig-a-acc { fill: #4d86b8; }
    .fig-a-pos { fill: #3f8f6f; }
    .fig-a-neg { fill: #b06a5e; }
  </style>
  <defs>
    <marker id="fig15-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--quote-border, #3c6b8f)"/>
    </marker>
  </defs>
  <rect class="fig-card" x="40" y="44" width="220" height="36" rx="8"/>
  <text class="fig-t" x="56" y="68">argv strings</text>
  <path class="fig-edge" d="M150 80 V 102" marker-end="url(#fig15-arrow)"/>
  <rect class="fig-card" x="40" y="104" width="220" height="48" rx="8"/>
  <text class="fig-t" x="56" y="134">arg starts with '-'?</text>
  <path class="fig-edge" d="M260 126 H 318" marker-end="url(#fig15-arrow)"/>
  <text class="fig-s" x="274" y="118">yes</text>
  <rect class="fig-card" x="320" y="104" width="300" height="44" rx="8"/>
  <text class="fig-t" x="336" y="124">flag -> typed value</text>
  <text class="fig-s" x="336" y="142">unknown flag -> usage + exit 1</text>
  <path class="fig-edge" d="M240 152 V 186 H 318" marker-end="url(#fig15-arrow)"/>
  <text class="fig-s" x="250" y="176">no</text>
  <rect class="fig-card" x="320" y="164" width="300" height="44" rx="8"/>
  <text class="fig-t" x="336" y="184">positional</text>
  <text class="fig-s" x="336" y="202">subcommand? model? prompt words</text>
  <path class="fig-edge" d="M620 126 H 644"/>
  <path class="fig-edge" d="M620 186 H 644"/>
  <path class="fig-edge" d="M644 126 V 186"/>
  <path class="fig-edge" d="M644 158 H 264 V 146 H 260" marker-end="url(#fig15-arrow)"/>
  <path class="fig-edge" d="M150 152 V 238" marker-end="url(#fig15-arrow)"/>
  <rect class="fig-card" x="40" y="240" width="220" height="48" rx="8"/>
  <text class="fig-t" x="56" y="270">positional[0]</text>
  <path class="fig-edge" d="M260 264 H 290"/>
  <path class="fig-edge" d="M290 248 V 352"/>
  <path class="fig-edge" d="M290 248 H 318" marker-end="url(#fig15-arrow)"/>
  <path class="fig-edge" d="M290 300 H 318" marker-end="url(#fig15-arrow)"/>
  <path class="fig-edge" d="M290 352 H 318" marker-end="url(#fig15-arrow)"/>
  <rect class="fig-card" x="320" y="226" width="300" height="44" rx="8"/>
  <text class="fig-t" x="336" y="246">bench / specverify</text>
  <text class="fig-s" x="336" y="264">separate parser, exits early</text>
  <rect class="fig-card" x="320" y="278" width="300" height="44" rx="8"/>
  <text class="fig-t" x="336" y="298">download / list / info</text>
  <text class="fig-s" x="336" y="316">do it, return (no model load)</text>
  <rect class="fig-card" x="320" y="330" width="300" height="44" rx="8"/>
  <text class="fig-t" x="336" y="350">serve / viz</text>
  <text class="fig-s" x="336" y="368">set mode flag, keep model arg</text>
  <path class="fig-edge" d="M150 288 V 330" marker-end="url(#fig15-arrow)"/>
  <text class="fig-s" x="158" y="316">anything else</text>
  <rect class="fig-card" x="40" y="332" width="220" height="44" rx="8"/>
  <text class="fig-t" x="56" y="352">anything else</text>
  <text class="fig-s" x="56" y="370">single-shot / --cnv inference</text>
  <path class="fig-edge" d="M150 376 V 402" marker-end="url(#fig15-arrow)"/>
  <rect class="fig-card" x="40" y="404" width="220" height="44" rx="8"/>
  <text class="fig-t" x="56" y="431">download::resolve</text>
  <path class="fig-edge" d="M260 426 H 288"/>
  <path class="fig-edge" d="M288 418 V 522"/>
  <path class="fig-edge" d="M288 418 H 318" marker-end="url(#fig15-arrow)"/>
  <path class="fig-edge" d="M288 470 H 318" marker-end="url(#fig15-arrow)"/>
  <path class="fig-edge" d="M288 522 H 318" marker-end="url(#fig15-arrow)"/>
  <rect class="fig-card" x="320" y="396" width="300" height="44" rx="8"/>
  <text class="fig-t" x="336" y="416">local path</text>
  <text class="fig-s" x="336" y="434">PathBuf (must exist)</text>
  <rect class="fig-card" x="320" y="448" width="300" height="44" rx="8"/>
  <text class="fig-t" x="336" y="468">hf: / ollama:</text>
  <text class="fig-s" x="336" y="486">download -> cached path</text>
  <rect class="fig-card" x="320" y="500" width="300" height="44" rx="8"/>
  <text class="fig-t" x="336" y="520">bare name</text>
  <text class="fig-s" x="336" y="538">search ~/.cache/minfer/models</text>
  <path class="fig-edge" d="M620 418 H 644"/>
  <path class="fig-edge" d="M620 470 H 644"/>
  <path class="fig-edge" d="M620 522 H 644"/>
  <path class="fig-edge" d="M644 418 V 582"/>
  <path class="fig-edge" d="M644 582 H 264" marker-end="url(#fig15-arrow)"/>
  <rect class="fig-card" x="40" y="560" width="220" height="44" rx="8"/>
  <text class="fig-t" x="56" y="580">model_path</text>
  <text class="fig-s" x="56" y="598">hand this to doc 02</text>
</svg>
