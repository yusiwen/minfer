<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 520" width="100%" style="max-width:100%;height:auto"
     role="img" aria-label="The CUDA tutorial's seven chapters as a reading ladder, from the GPU mental model to the reference-doc map.">
  <style>
    .fig-card  { fill: var(--quote-bg, #13293d); stroke: var(--quote-border, #274357); stroke-width: 1; }
    .fig-alt   { fill: var(--table-alternate-bg, #0f2438); stroke: var(--quote-border, #274357); stroke-width: 1; }
    .fig-t     { fill: var(--fg, #dce6f0); font-size: 12.5px; font-weight: 600; }
    .fig-s     { fill: var(--fg, #dce6f0); font-size: 11.5px; opacity: .90; }
    .fig-cap   { fill: var(--fg, #dce6f0); font-size: 11px; letter-spacing: .10em; opacity: .90; }
    .fig-step  { fill: var(--quote-bg, #13293d); stroke: var(--quote-border, #274357); stroke-width: 1; }
    .fig-step-t { fill: var(--fg, #dce6f0); font-size: 12px; font-weight: 600; }
    .fig-edge  { stroke: var(--quote-border, #3c6b8f); stroke-width: 1.25; fill: none; }
    .fig-a-acc { fill: #4d86b8; }
    .fig-a-pos { fill: #3f8f6f; }
    .fig-a-neg { fill: #b06a5e; }
  </style>
  <defs>
    <marker id="fig36-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--quote-border, #3c6b8f)"/>
    </marker>
  </defs>
  <text class="fig-cap" x="24" y="22">READ IN ORDER</text>
  <circle class="fig-step" cx="70" cy="48" r="16"/>
  <text class="fig-step-t" x="70" y="53" text-anchor="middle">01</text>
  <rect class="fig-card" x="104" y="25" width="660" height="46" rx="8"/>
  <text class="fig-t" x="120" y="45">01 - What kind of machine is a GPU</text>
  <text class="fig-s" x="120" y="63">host/device, SIMT, the memory hierarchy, Toy #1</text>
  <path class="fig-edge" d="M70 64 V 102" marker-end="url(#fig36-arrow)"/>
  <circle class="fig-step" cx="70" cy="118" r="16"/>
  <text class="fig-step-t" x="70" y="123" text-anchor="middle">02</text>
  <rect class="fig-card" x="104" y="95" width="660" height="46" rx="8"/>
  <text class="fig-t" x="120" y="115">02 - The minimal CUDA you actually need</text>
  <text class="fig-s" x="120" y="133">kernel syntax, error checking, streams, the build (Toys #2-#3)</text>
  <path class="fig-edge" d="M70 134 V 172" marker-end="url(#fig36-arrow)"/>
  <circle class="fig-step" cx="70" cy="188" r="16"/>
  <text class="fig-step-t" x="70" y="193" text-anchor="middle">03</text>
  <rect class="fig-card" x="104" y="165" width="660" height="46" rx="8"/>
  <text class="fig-t" x="120" y="185">03 - Reading minfer's kernels I</text>
  <text class="fig-s" x="120" y="203">elementwise add, Q4_0 dequant, embedding gather</text>
  <path class="fig-edge" d="M70 204 V 242" marker-end="url(#fig36-arrow)"/>
  <circle class="fig-step" cx="70" cy="258" r="16"/>
  <text class="fig-step-t" x="70" y="263" text-anchor="middle">04</text>
  <rect class="fig-card" x="104" y="235" width="660" height="46" rx="8"/>
  <text class="fig-t" x="120" y="255">04 - Reading minfer's kernels II</text>
  <text class="fig-s" x="120" y="273">scalar GEMV, vectorized GEMV, tiled GEMM, int8 MMQ</text>
  <path class="fig-edge" d="M70 274 V 312" marker-end="url(#fig36-arrow)"/>
  <circle class="fig-step" cx="70" cy="328" r="16"/>
  <text class="fig-step-t" x="70" y="333" text-anchor="middle">05</text>
  <rect class="fig-card" x="104" y="305" width="660" height="46" rx="8"/>
  <text class="fig-t" x="120" y="325">05 - Reading minfer's kernels III</text>
  <text class="fig-s" x="120" y="343">flash-attention prefill, fused decode tail, CUDA Graphs</text>
  <path class="fig-edge" d="M70 344 V 382" marker-end="url(#fig36-arrow)"/>
  <circle class="fig-step" cx="70" cy="398" r="16"/>
  <text class="fig-step-t" x="70" y="403" text-anchor="middle">06</text>
  <rect class="fig-card" x="104" y="375" width="660" height="46" rx="8"/>
  <text class="fig-t" x="120" y="395">06 - Optimization methods</text>
  <text class="fig-s" x="120" y="413">ncu / nsys profiling, the technique catalog, the gate chain</text>
  <path class="fig-edge" d="M70 414 V 452" marker-end="url(#fig36-arrow)"/>
  <circle class="fig-step" cx="70" cy="468" r="16"/>
  <text class="fig-step-t" x="70" y="473" text-anchor="middle">07</text>
  <rect class="fig-card" x="104" y="445" width="660" height="46" rx="8"/>
  <text class="fig-t" x="120" y="465">07 - Where to go next</text>
  <text class="fig-s" x="120" y="483">reference-doc reading order, nvcc/ncu cheat sheet, toy index</text>
</svg>
