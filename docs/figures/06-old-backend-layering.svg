<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 690" width="100%" style="max-width:100%;height:auto"
     role="img" aria-label="The deleted per-layer backend fallback: embedding on GPU or CPU, a per-layer eligibility test, and the CPU loop that took over from the first ineligible layer.">
  <style>
    .fig-card  { fill: var(--quote-bg, #13293d); stroke: var(--quote-border, #274357); stroke-width: 1; }
    .fig-alt   { fill: var(--table-alternate-bg, #0f2438); stroke: var(--quote-border, #274357); stroke-width: 1; }
    .fig-t     { fill: var(--fg, #dce6f0); font-size: 12.5px; font-weight: 600; }
    .fig-s     { fill: var(--fg, #dce6f0); font-size: 11.5px; opacity: .90; }
    .fig-cap   { fill: var(--fg, #dce6f0); font-size: 11px; letter-spacing: .10em; opacity: .90; }
    .fig-edge  { stroke: var(--quote-border, #3c6b8f); stroke-width: 1.25; fill: none; }
    .fig-a-acc { fill: #4d86b8; }
    .fig-a-pos { fill: #3f8f6f; }
    .fig-a-neg { fill: #b06a5e; }
  </style>
  <defs>
    <marker id="fig65-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--quote-border, #3c6b8f)"/>
    </marker>
  </defs>
  <text class="fig-cap" x="40" y="22">LAYER-BY-LAYER FALLBACK (THEN)</text>
  <rect class="fig-alt" x="40" y="44" width="240" height="40" rx="8"/>
  <text class="fig-t" x="56" y="69">forward nt tokens</text>
  <path class="fig-edge" d="M160 84 V 106" marker-end="url(#fig65-arrow)"/>
  <rect class="fig-alt" x="40" y="108" width="240" height="48" rx="8"/>
  <text class="fig-t" x="56" y="138">embedding on GPU?</text>
  <path class="fig-edge" d="M280 132 H 338" marker-end="url(#fig65-arrow)"/>
  <path class="fig-edge" d="M240 156 V 186 H 338" marker-end="url(#fig65-arrow)"/>
  <rect class="fig-alt" x="340" y="100" width="320" height="44" rx="8"/>
  <text class="fig-t" x="356" y="120">GPU embed lookup</text>
  <text class="fig-s" x="356" y="138">-> buf_hidden</text>
  <rect class="fig-alt" x="340" y="164" width="320" height="44" rx="8"/>
  <text class="fig-t" x="356" y="184">CPU embed</text>
  <text class="fig-s" x="356" y="202">-> upload hidden</text>
  <path class="fig-edge" d="M660 122 H 676 V 248 H 660" marker-end="url(#fig65-arrow)"/>
  <path class="fig-edge" d="M500 208 V 226" marker-end="url(#fig65-arrow)"/>
  <rect class="fig-alt" x="340" y="228" width="320" height="40" rx="8"/>
  <text class="fig-t" x="356" y="253">upload positions</text>
  <path class="fig-edge" d="M500 268 V 284 H 160 V 298" marker-end="url(#fig65-arrow)"/>
  <rect class="fig-alt" x="40" y="300" width="240" height="48" rx="8"/>
  <text class="fig-t" x="56" y="330">per layer: layer_gpu ok?</text>
  <path class="fig-edge" d="M280 324 H 310 V 314 H 338" marker-end="url(#fig65-arrow)"/>
  <path class="fig-edge" d="M280 336 H 306 V 382 H 338" marker-end="url(#fig65-arrow)"/>
  <rect class="fig-alt" x="340" y="292" width="320" height="44" rx="8"/>
  <text class="fig-t" x="356" y="312">all layers on GPU</text>
  <text class="fig-s" x="356" y="330">output_norm stays on GPU</text>
  <rect class="fig-alt" x="340" y="356" width="320" height="52" rx="8"/>
  <text class="fig-t" x="356" y="376">at layer i: submit partial GPU work</text>
  <text class="fig-s" x="356" y="394">download hidden, sync KV to CPU</text>
  <path class="fig-edge" d="M500 408 V 426" marker-end="url(#fig65-arrow)"/>
  <rect class="fig-alt" x="340" y="428" width="320" height="44" rx="8"/>
  <text class="fig-t" x="356" y="448">CPU loop from layer i</text>
  <text class="fig-s" x="356" y="466">no further GPU work</text>
  <path class="fig-edge" d="M660 306 H 708 V 514 H 660" marker-end="url(#fig65-arrow)"/>
  <path class="fig-edge" d="M660 322 H 692 V 440 H 660" marker-end="url(#fig65-arrow)"/>
  <rect class="fig-alt" x="340" y="492" width="320" height="44" rx="8"/>
  <text class="fig-t" x="356" y="512">download logits</text>
  <text class="fig-s" x="356" y="530">-> return</text>
  <path class="fig-edge" d="M500 472 V 490" marker-end="url(#fig65-arrow)"/>
  <path class="fig-edge" d="M660 460 H 680 V 578 H 660" marker-end="url(#fig65-arrow)"/>
  <rect class="fig-alt" x="340" y="556" width="320" height="44" rx="8"/>
  <text class="fig-t" x="356" y="576">output_norm + output matmul</text>
  <text class="fig-s" x="356" y="594">on CPU</text>
  <path class="fig-edge" d="M500 600 V 610 H 160 V 618" marker-end="url(#fig65-arrow)"/>
  <rect class="fig-alt" x="40" y="620" width="240" height="44" rx="8"/>
  <text class="fig-t" x="56" y="647">return logits</text>
</svg>
