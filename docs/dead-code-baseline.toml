# Dead-code baseline for the stripped oracle (issue #254, Layer 2).
#
# `scripts/check_dead_code_oracle.py` strips **every** `allow(dead_code)` in a
# scratch copy of the tree, runs `cargo check --release [--features cuda]` with
# `RUSTFLAGS=--cap-lints=warn`, and takes every `src/` span of every `dead_code`
# diagnostic. The set below is what that oracle reports on the base commit; a
# **new** `(name, kind)` is a gate failure, printed with its file:line.
#
# Update rule. An addition is a decision, not an annoyance: either make the item
# live, delete it, or add an entry here **in the same PR** with a one-line reason
# that names the consuming test or feature, cites the owning ticket, or says what
# would construct/read it (the AGENTS.md Core Convention 5 / #244 convention).
# The checker prints a paste-ready entry for every addition. A **removal** is
# informational — drop the entry when convenient; the manifest only has to keep
# new dead code out.
#
# Regenerate (from the repository root, with a warm target dir):
#   python3 scripts/check_dead_code_oracle.py --config cpu  --print-toml
#   python3 scripts/check_dead_code_oracle.py --config cuda --print-toml
#
# `cpu`  = `cargo check --release`            -> the `test-linux-cpu` CI job
# `cuda` = `cargo check --release --features cuda` -> the `build-linux-cuda` job
# (`cuda` is the maximal configuration: `src/cuda.rs` and
# `src/graph/cuda_backend.rs` exist only under the feature. `--features
# debug_dump` and `cuda_static` are not covered.)
#
# macOS is **unjudged**, on purpose. Both halves of the blind spot:
#   * a macOS-only module is never compiled on Linux (or in the Linux CI jobs),
#     so nothing here is evidence about it;
#   * a cross-platform item whose only caller sits in a
#     `#[cfg(target_os = "macos")]` test block *looks* dead here while it is live
#     there — `ModelDef::forward_graph` was exactly that case, which is why it is
#     listed below with the test named in its reason.
# `build-macos` only type-checks, so the manifest records the blind spot instead
# of pretending coverage: hence the marker below.
#
# Architecture. The dead set can differ by `cfg(target_arch)` (NEON vs AVX2-gated
# code). This manifest is the **union** of the host and the x86_64 CI runner: an
# entry present on only one architecture is still listed, and the other
# architecture reports it as a removal (informational). `--target
# x86_64-unknown-linux-gnu` reproduces the CI set locally; the authoritative run
# is the CI job itself, which passes no `--target`.
macos = "unjudged"

