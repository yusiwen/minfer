# Dead-code baseline for the stripped oracle (issue #254, Layer 2).
#
# `scripts/check_dead_code_oracle.py` strips **every** `allow(dead_code)` in a
# scratch copy of the tree, runs `cargo check --release [--features cuda]` with
# `RUSTFLAGS=--cap-lints=warn`, and takes every `src/` span of every `dead_code`
# diagnostic. The set below is what that oracle reports on the base commit; a
# **new** `(name, kind)` is a gate failure, printed with its file:line.
#
# Update rule. An addition is a decision, not an annoyance: either make the item
# live, delete it, or add an entry here **in the same PR** with a one-line reason
# that names the consuming test or feature, cites the owning ticket, or says what
# would construct/read it (the AGENTS.md Core Convention 5 / #244 convention).
# The checker prints a paste-ready entry for every addition. A **removal** is
# informational — drop the entry when convenient; the manifest only has to keep
# new dead code out.
#
# Regenerate (from the repository root, with a warm target dir):
#   python3 scripts/check_dead_code_oracle.py --config cpu  --print-toml
#   python3 scripts/check_dead_code_oracle.py --config cuda --print-toml
#   python3 scripts/check_dead_code_oracle.py --config macos --print-toml  # on a Mac
#
# `cpu`   = `cargo check --release`            -> the `test-linux-cpu` CI job
# `cuda`  = `cargo check --release --features cuda` -> the `build-linux-cuda` job
# `macos` = `cargo check --release` **on a macOS host** -> no CI job; the
#           on-demand Mac run that compiles the `cfg(target_os = "macos")`
#           modules. The checker refuses this config on any other host; it was run
#           on a Mac 2026-10-09 (#332) and the `[[macos]]` section at the end of
#           the file is that measurement.
# (`cuda` is the maximal configuration: `src/cuda.rs` and
# `src/graph/cuda_backend.rs` exist only under the feature. `--features
# debug_dump` and `cuda_static` are not covered.)
#
# The two halves of the old macOS blind spot are both closed by the run below:
#   * a macOS-only module is compiled and judged there (it reports **no** dead item
#     under `src/metal/` or `src/graph/metal_backend*`);
#   * a cross-platform item whose only caller sits in a macOS test block is
#     reported dead by the non-test check and is listed with that test named in
#     its reason — `ModelDef::forward_graph` is exactly that case.
# `build-macos` still compiles the test target since #303 (`cargo test --release
# --no-run`); the Mac run is the on-demand oracle, not a CI job.
#
# Architecture. The dead set can differ by `cfg(target_arch)` (NEON vs AVX2-gated
# code). This manifest is the **union** of the host and the x86_64 CI runner: an
# entry present on only one architecture is still listed, and the other
# architecture reports it as a removal (informational). `--target
# x86_64-unknown-linux-gnu` reproduces the CI set locally; the authoritative run
# is the CI job itself, which passes no `--target`.
#
# The macOS half is **judged**, not marked: it was run on a Mac on 2026-10-09
# (#332's Mac half) — the same stripped `cargo check --release`, where the
# `#[cfg(target_os = "macos")]` modules are compiled. It reports **42** items,
# and the macOS set is exactly the CPU set **minus** `QueryFailed`/`Reported`
# (`graph/allocplan.rs`) and `allows_weight` (`graph/offload.rs`): macOS makes all
# three live — `MpsState::device_memory` constructs the two `DeviceMemory`
# variants, and the loaders call `allows_weight` under
# `#[cfg(any(target_os = "macos", feature = "cuda"))]`. Every one of the 42
# therefore carries the same platform-neutral reason as its `[[cpu]]` twin; the
# `[[macos]]` section at the end of the file mirrors them.
#
# The same run reports **no** dead item under `src/metal/` or
# `src/graph/metal_backend*`. That is the evidence [#255]'s two dispositions rest
# on: the container-level `impl MpsState` blanket is deleted (loaders, `main.rs`,
# `graph/metal_backend.rs` and `get_or_grow`/`cmd_buffer` read all ten members) and
# `matmul_on_gpu_buf` is `#[cfg(test)]`, so the non-test macOS build has neither.
#
# `forward_graph` is in the set (dead in this non-test macOS check), and its
# `#[cfg_attr(any(not(test), not(target_os = "macos")), allow(dead_code))]`
# (`src/models/mod.rs`) applies no allow in the macOS **test** build, where its
# caller `models::qwen2::graph::tests::real_model::graph_metal_matches_cpu_logits`
# keeps it live — that test is named in its `[[macos]]` reason.
#
# The `"unjudged"` marker is still the spelling for a config with no recorded
# measurement, and only an `unjudgeable` config may carry it; `macos` no longer
# does. A macOS-only dead item is an **addition** on the next Mac run.
#
# Measurement — box `macbook (macOS 27.0.1, Apple M4 Pro)` (hostname
# `macbookpro-ysw`), 2026-10-09, command
# `python3 scripts/check_dead_code_oracle.py --config macos --print-toml`:
# `stripped 40 annotation(s); dead_code diagnostics: 29; src/ spans (sites): 53;
# items: 42`. Re-run it on a Mac after any source change: `macos` is still an
# on-demand run, not a CI job (`build-macos` only compiles the test target).
#
# [#255]: https://github.com/yusiwen/minfer/issues/255

