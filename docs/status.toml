# --- suite counts, per box --------------------------------------------------
# `box` is the *absolute* name of the machine a row was measured on, never a
# relative `this box` / `local`: an agent reading the record may be on another
# machine (gate contract rule 5). The convention:
#   `dgxspark (aarch64, GB10 sm_121)` — the maintainer's DGX Spark; one physical
#       machine, so the CPU and the CUDA rows share the label.
#   `x86_64 (CI runner)` — GitHub's runner; CPU-only, no GPU and no aarch64.
# The box is part of the identity: `quants::neon_correctness` is
# `cfg(all(test, target_arch = "aarch64"))`, so the aarch64 box reports two more
# unit tests than the x86_64 CI runner. Only `x86_64 (CI runner)` is compared
# live, by `test-linux-cpu`; every other row is a recorded measurement. A row's
# `ignored` count is also a **derivation**, not a measurement, whenever a change adds
# a platform-gated test: #208's Metal half added one `#[ignore]`d macOS-only gate
# (`f208_bf16_weights_run_on_the_metal_device`, a no-op off macOS), which raises the
# ignored count on every box without re-running it there. `projection_*` carries only
# `passed`, so an ignored-count move is derived — say so when recording it.

[[counts]]
key = "cpu-unit"
box = "dgxspark (aarch64, GB10 sm_121)"
suite = "unit"
command = "cargo test --release"
date = "2026-10-07"
passed = 488
failed = 0
ignored = 40
integration_passed = 10
integration_failed = 0
integration_ignored = 6
live_check = false
note = "recorded measurement; CI runs x86_64; the +4 over the 2026-10-06 measurement are #205's three fixture-manifest tests (the manifest reader, the outside-the-cache arm and the tampered-cache refusal) plus #349's parity-verdict classifier, and the +1 on top is #306's format-aware physical-shift gate; the next +1 is #362's platform-neutral `every_device_gathers_the_attn_map`"
file = "AGENTS.md"
regex = 'CPU unit, box `(?P<box>[^`]+)`, `cargo test --release`, (?P<date>[0-9]{4}-[0-9]{2}-[0-9]{2}): \*\*(?P<passed>[0-9]+) passed / (?P<failed>[0-9]+) failed / (?P<ignored>[0-9]+) ignored\*\* unit \+ \*\*(?P<integration_passed>[0-9]+) / (?P<integration_failed>[0-9]+) / (?P<integration_ignored>[0-9]+)\*\* integration'

