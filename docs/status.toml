# docs/status.toml — the machine-readable source of truth for the status prose.
#
# The plan's phase counters and its `next:` sentence, its baseline/`refreshed
# against` commit ids, and `AGENTS.md`'s suite counts are **derived facts**: they
# are written here and `scripts/check_status.py --check` (CI job `check-docs`)
# fails when the prose disagrees with this file, naming the file, the line and
# both values. Edit *this* file, not a counter.
#
# Two kinds of prose target live below. The three scalars use `[prose.<field>]`;
# each `[[phase]]` and each `[[counts]]` row carries its own `file` + `regex`, so
# the checker holds no second copy of any value. A regex compares only the named
# groups it captures: `state` / `done` / `total` for a phase, and the count and
# `date` fields for a counts row. `box` is captured so the row is matched to the
# right bullet when two rows share a command.
#
# What the checker can and cannot prove is stated in `scripts/check_status.py
# --help`. In short: it proves the prose *agrees with this file* and that a
# counts row's values *matched a cargo log that was parsed*. It cannot prove a
# measurement was real. Every row whose `live_check` is false is a **recorded
# measurement** (CI has no GPU and no aarch64 runner) and is labelled `note` so
# the gate cannot be read as "verified".

schema = 1

# The commit the plan's status block was first baselined against, and the master
# commit this status was last refreshed against. Both must be ancestors of HEAD.
# The second is bumped when a phase or round closes, not on every PR — which is
# what the plan's prose promised while the value sat at f663750 for 190 commits.
baseline_commit = "f32daa7"
refreshed_against = "53b3ace"

# The one honest `next:` sentence. It replaced a stale one that still called
# E4/E5 upcoming years after they landed (issue #94), and a later one that read
# "F1 (needs x86)": accurate and useless at once, because the project's two
# boxes are dgxspark (aarch64) and macbook (macOS) and the x86_64 CI runner
# cannot host interactive work (#335). It now names a lane that can start on
# each box; F1's hardware wait is recorded in the plan's §9 table, its §11
# sequencing diagram and its §14 hardware row, where a reader of the plan sees
# it. The value is compared *literally* against the plan's `Next: ….**`
# sentence, so the two must be edited together.
next = "the macOS round-2 tickets tracked in #333, on macbook (macOS 27.0.1, Apple M4 Pro), and the open Linux-side tickets on dgxspark (aarch64, GB10 sm_121); F1 (AVX2 K-quant dots) still waits for an x86 host"

# --- prose locations for the three scalars ----------------------------------

[prose.baseline_commit]
file = "docs/ARCHITECTURE-EXECUTION-PLAN.md"
regex = 'HEAD = (?P<value>[0-9a-f]{7,40})'

[prose.refreshed_against]
file = "docs/ARCHITECTURE-EXECUTION-PLAN.md"
regex = 'master =\s*(?P<value>[0-9a-f]{7,40})'

[prose.next]
file = "docs/ARCHITECTURE-EXECUTION-PLAN.md"
regex = 'Next: (?P<value>[^\n]+?)\.\*\*'

# --- phase counters ---------------------------------------------------------
# `done`/`total` are the preamble's `(done/total)`; `state` is its completion
# word. Phase G is **complete** (7/7, 2026-10-06); the rows past G7 are the gaps
# the round found while executing it.

[[phase]]
