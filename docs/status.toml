# --- suite counts, per box --------------------------------------------------
# The box is part of the identity: `quants::neon_correctness` is
# `cfg(all(test, target_arch = "aarch64"))`, so the aarch64 box reports two more
# unit tests than the x86_64 CI runner. Only `x86_64 (CI runner)` is compared
# live, by `test-linux-cpu`; every other row is a recorded measurement.

[[counts]]
key = "cpu-unit"
box = "aarch64 (this box)"
suite = "unit"
command = "cargo test --release"
date = "2026-09-26"
passed = 463
failed = 0
ignored = 33
integration_passed = 10
integration_failed = 0
integration_ignored = 6
live_check = false
note = "recorded measurement; CI runs x86_64"
file = "AGENTS.md"
regex = 'CPU unit, box `(?P<box>[^`]+)`, `cargo test --release`, (?P<date>[0-9]{4}-[0-9]{2}-[0-9]{2}): \*\*(?P<passed>[0-9]+) passed / (?P<failed>[0-9]+) failed / (?P<ignored>[0-9]+) ignored\*\* unit \+ \*\*(?P<integration_passed>[0-9]+) / (?P<integration_failed>[0-9]+) / (?P<integration_ignored>[0-9]+)\*\* integration'

