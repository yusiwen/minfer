[package]
name = "minfer"
version = "0.0.6"
edition = "2021"
description = "A minimal local LLM inference engine built from scratch in Rust"
license = "MIT"
repository = "https://github.com/yusiwen/minfer"

[dependencies]
rand = "0.8"
regex = "1"
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }

# OpenAI-compatible HTTP server (OPENAI-CHAT-API-PLAN.md, Phase 2+)
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"

[features]
cuda = []
debug_dump = []

[dev-dependencies]
# Git hook manager: on the first build of dev-dependencies (`cargo test` /
# `cargo build --tests`) it installs the `.rusty-hook.toml` hooks (here a
# pre-commit that runs `cargo fmt`) into `.git/hooks`, so a fresh clone gets
# the formatting hook automatically without a manual `git config`.
rusty-hook = "^0.11.2"

[[example]]
name = "cuda_graph_diag"
path = "experiments/cuda/cuda_graph_rust/cuda_graph_diag.rs"
required-features = ["cuda"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = "0.3"
block2 = "0.6"
objc2-foundation = "0.3"
objc2 = "0.6"
dispatch2 = "0.3"
