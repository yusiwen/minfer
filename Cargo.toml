[package]
name = "minfer"
version = "0.0.9"
edition = "2021"
description = "A minimal local LLM inference engine built from scratch in Rust"
license = "MIT"
repository = "https://github.com/yusiwen/minfer"


[[bin]]
name = "minfer"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
rand = "0.8"
regex = "1"
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# `preserve_order` is a render contract, not a convenience (#597): a `tools`
# entry reaches the prompt through the template's `| tojson`, and transformers
# renders the client's own key order. minijinja's default `ValueMap` is a
# `BTreeMap`, which would sort the keys the render path just preserved.
# (`serde_json`'s matching feature is deliberately NOT enabled: the JSON-Schema
# grammar compiler iterates a schema's `map`, and its generated grammar depends
# on that order — a render-only concern must not move the grammar.)
minijinja = { version = "2", default-features = false, features = ["builtins", "serde", "preserve_order"] }

# OpenAI-compatible HTTP server (OPENAI-CHAT-API-PLAN.md, Phase 2+)
axum = { version = "0.7", optional = true }
# `time` + `signal` are F8's (#51): the bounded graceful drain needs
# `tokio::time::timeout` and the SIGINT/SIGTERM handlers. Both are platform-neutral
# (no new crate, no new dependency), so the macOS and CUDA builds are unaffected.
tokio = { version = "1", optional = true, features = ["sync"] }
tokio-stream = { version = "0.1", optional = true, features = ["sync"] }
tower-http = { version = "0.6", optional = true, features = ["cors"] }
uuid = { version = "1", optional = true, features = ["v4"] }
futures-util = { version = "0.3", optional = true }

# Test-only. `AsyncReadExt`/`AsyncWriteExt` are what F8's `/metrics` test drives a
# real HTTP/1.1 request with; the production `tokio` dependency stays without
# `io-util`, and cargo unifies the feature for the test build only.
#
# `sha2` is test-only for the same reason, and is #205's whole point: the F6
# fixture manifest (`tests/fixtures/f6-fixtures.json`) records each cached reference's
# content hash, and the gate that consumes a reference verifies it before
# comparing (`src/tooling/tests/f6_fixtures.rs`). Hashing is not something to
# hand-write in a test module, and the production dependency graph — which
# `cargo build --release` and the `deny(warnings)` gate both cover — does not
# grow by it.
[dev-dependencies]
tokio = { version = "1", features = ["io-util"] }
sha2 = "0.10"

[features]
# Defaults keep `cargo build --release` producing today's binary. A consumer of
# the engine uses `default-features = false` (ADR-0079); S9 turns the macOS
# Metal backend into a feature.
default = ["cli"]
# The application layer: the binary and the modules only it uses.
cli = ["server", "tooling", "viz"]
# The OpenAI-compatible HTTP server (axum + tokio). The visualizer is separate
# (`viz`), so a server-only host does not build it.
server = [
    "dep:axum",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tower-http",
    "dep:uuid",
    "dep:futures-util",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/net",
    "tokio/time",
    "tokio/signal",
    "observe",
]
# `live`/`viz` observation hooks. Off in a consumer build, where the engine core
# must not need tokio (S2).
observe = ["dep:tokio", "tokio/sync"]
tooling = []
# The self-contained visualizer (`minfer viz`): its live capture rides `observe`.
viz = ["server"]

cuda = []
# llama.cpp-style choice of how the CUDA runtime is linked: with `cuda_static`
# the cudart archive (libcudart_static.a) is linked statically so the resulting
# binary has NO `libcudart.so` NEEDED dependency — it only needs the NVIDIA
# driver (libcuda.so.1, dlopen'd lazily at runtime) + libstdc++ at runtime.
# Without it (default) `-lcudart` is a shared link and the binary requires a
# CUDA toolkit runtime to be present (see build.rs). Must be combined with
# `cuda`. Mirrors llama.cpp's `GGML_STATIC`.
cuda_static = ["cuda"]
debug_dump = []

[[example]]
name = "cuda_graph_diag"
path = "experiments/cuda/cuda_graph_rust/cuda_graph_diag.rs"
required-features = ["cuda"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = "0.3"
block2 = "0.6"
objc2-foundation = "0.3"
objc2 = "0.6"
dispatch2 = "0.3"
