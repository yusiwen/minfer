[package]
name = "minfer"
version = "0.0.8"
edition = "2021"
description = "A minimal local LLM inference engine built from scratch in Rust"
license = "MIT"
repository = "https://github.com/yusiwen/minfer"

[dependencies]
rand = "0.8"
regex = "1"
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }

# OpenAI-compatible HTTP server (OPENAI-CHAT-API-PLAN.md, Phase 2+)
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"

[features]
cuda = []
# llama.cpp-style choice of how the CUDA runtime is linked: with `cuda_static`
# the cudart archive (libcudart_static.a) is linked statically so the resulting
# binary has NO `libcudart.so` NEEDED dependency — it only needs the NVIDIA
# driver (libcuda.so.1, dlopen'd lazily at runtime) + libstdc++ at runtime.
# Without it (default) `-lcudart` is a shared link and the binary requires a
# CUDA toolkit runtime to be present (see build.rs). Must be combined with
# `cuda`. Mirrors llama.cpp's `GGML_STATIC`.
cuda_static = ["cuda"]
debug_dump = []

[[example]]
name = "cuda_graph_diag"
path = "experiments/cuda/cuda_graph_rust/cuda_graph_diag.rs"
required-features = ["cuda"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = "0.3"
block2 = "0.6"
objc2-foundation = "0.3"
objc2 = "0.6"
dispatch2 = "0.3"
